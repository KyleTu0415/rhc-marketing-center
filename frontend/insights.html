<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="assets/rhc-fonts.css">

<title>RHC 安瑞康 — 新闻中心</title>
<style>
:root{
  --color-bg:#F7F8FA; --color-surface:#FFFFFF;
  --color-primary:#C8102E; --color-primary-dark:#A50D26;
  --color-primary-light:#FDE8EB; --color-primary-xlight:#FFF1F3;
  --color-text:#1A1A1A; --color-text-secondary:#6B7280; --color-text-tertiary:#9CA3AF;
  --color-border:#E5E7EB; --color-border-light:#F3F4F6;
  --color-success:#16A37B; --color-warning:#F3A94B; --color-danger:#E5484D; --color-info:#3B82F6;
  --font-sans:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06); --shadow-md:0 4px 12px rgba(0,0,0,0.08); --shadow-lg:0 8px 24px rgba(0,0,0,0.10);
  --transition-fast:0.15s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--color-text);background:var(--color-bg)}
a{color:var(--color-primary);text-decoration:none}
button{font-family:var(--font-sans);cursor:pointer;border:none;background:none;font-size:13px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:3px}

/* ===== 顶部导航 ===== */
.topbar{
  position:sticky;top:0;z-index:100;
  background:var(--color-surface);
  border-bottom:1px solid var(--color-border);
  display:flex;align-items:center;gap:16px;
  padding:0 32px;height:60px;
}
/* 品牌区：DOM 结构与样式与门户首页 panel.html 完全一致 */
.topnav-brand{display:flex;align-items:center;gap:12px;cursor:pointer;flex:0 0 auto}
.topnav-brand .logo-mark{
  height:40px;width:auto;
  display:flex;align-items:center;justify-content:center;
}
.topnav-brand .brand-sub{font-size:15px;font-weight:600;color:var(--color-text);margin-top:1px;letter-spacing:0.5px}
.topbar-divider{width:1px;height:16px;background:var(--color-border);flex-shrink:0;margin-top:1px}
.topbar-title{font-size:14px;color:var(--color-text-secondary);margin-top:1px}
.topbar-back{
  margin-left:auto;display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;color:var(--color-primary);
  padding:7px 14px;border:1px solid var(--color-primary);border-radius:var(--radius-sm);
  transition:all var(--transition-fast);
}
.topbar-back:hover{background:var(--color-primary);color:#fff}

/* ===== 主体：资讯看板 ===== */
.page{max-width:1280px;margin:0 auto;padding:22px 32px 60px}

/* 工具栏 */
.board-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.board-meta{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--color-text-secondary)}
.board-dot{
  width:8px;height:8px;border-radius:50%;background:var(--color-success);flex-shrink:0;
  box-shadow:0 0 0 3px rgba(22,163,123,0.15);
}
.board-meta strong{color:var(--color-text);font-weight:600}
.refresh-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 16px;border-radius:var(--radius-sm);
  border:1px solid var(--color-border);background:var(--color-surface);
  font-size:13px;font-weight:600;color:var(--color-text-secondary);
  transition:all var(--transition-fast);
}
.refresh-btn:hover{border-color:var(--color-primary);color:var(--color-primary)}
.refresh-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.refresh-btn.spinning svg{animation:spin 0.7s linear infinite}

/* 看板 4 列 */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start}
.kanban-col{min-width:0}
.col-header{
  position:sticky;top:60px;z-index:40;
  display:flex;align-items:center;gap:8px;
  padding:10px 6px;margin-bottom:10px;
  background:var(--color-bg);
  border-bottom:2px solid var(--color-border);
}
.col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.col-name{font-size:13px;font-weight:700;color:var(--color-text);letter-spacing:0.3px}
.col-count{
  margin-left:auto;font-size:11px;font-weight:700;color:var(--color-text-secondary);
  background:var(--color-border-light);border-radius:10px;padding:1px 8px;line-height:1.6;
}

/* 新闻小卡片 */
.news-card{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
  padding:12px 14px;margin-bottom:10px;
  transition:all var(--transition-fast);
}
.news-card:hover{border-color:var(--color-primary);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.news-card-date{font-size:11px;color:var(--color-text-tertiary);font-variant-numeric:tabular-nums;letter-spacing:0.3px}
.news-card-title{
  font-size:13px;font-weight:600;color:var(--color-text);line-height:1.55;
  margin:6px 0 9px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:3.1em;
  transition:color var(--transition-fast);
}
a.news-card-title:hover{color:var(--color-primary)}
.news-card-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.news-region-tag{
  font-size:10px;color:var(--color-text-tertiary);
  background:var(--color-border-light);border-radius:4px;padding:1px 7px;line-height:1.6;
}
.news-bookmark-btn{
  margin-left:auto;width:24px;height:24px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:5px;color:var(--color-text-tertiary);transition:all var(--transition-fast);
}
.news-bookmark-btn:hover{color:var(--color-primary);background:var(--color-primary-xlight)}
.news-bookmark-btn.saved{color:var(--color-primary)}
.news-bookmark-btn.saved svg{fill:var(--color-primary)}
.news-bookmark-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:fill var(--transition-fast)}

/* 加载状态 */
.load-status{text-align:center;padding:22px 0 6px;color:var(--color-text-tertiary);font-size:13px}
.load-status .spinner{
  display:inline-block;width:16px;height:16px;border:2px solid var(--color-border);
  border-top-color:var(--color-primary);border-radius:50%;
  animation:spin 0.7s linear infinite;vertical-align:-3px;margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* 响应式 */
@media(max-width:1100px){
  .page{padding:20px 20px 60px}
  .kanban{grid-template-columns:repeat(2,1fr)}
  .col-header{position:static}
}
@media(max-width:640px){
  .kanban{grid-template-columns:1fr}
  .topbar{padding:0 16px}
}

/* Toast */
.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1A1A1A;color:#fff;padding:10px 22px;border-radius:8px;
  font-size:13px;z-index:2000;opacity:0;pointer-events:none;
  transition:all 0.25s ease;box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.toast-success{background:var(--color-success)}
.toast.toast-warning{background:var(--color-warning)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topnav-brand" onclick="location.href='panel.html'">
    <div class="logo-mark">
      <img src="assets/rhc-logo-mark.png?v=20260903" alt="RHC" style="height:40px;width:auto;object-fit:contain;">
    </div>
    <div>
      <div class="brand-sub">智能工作平台</div>
    </div>
  </div>
  <div class="topbar-divider"></div>
  <span class="topbar-title">市场洞察</span>
  <button class="topbar-back" onclick="location.href='panel.html'">← 返回门户</button>
</div>

<div class="page">
  <div class="board-toolbar">
    <div class="board-meta">
      <span>共 <strong id="board-count"></strong> 条 · 最近更新 <strong id="board-latest"></strong></span>
    </div>
    <button class="refresh-btn" id="refresh-btn" onclick="refreshBoard()">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      刷新
    </button>
  </div>

  <div class="kanban" id="kanban">
    <div class="kanban-col">
      <div class="col-header">
        <span class="col-dot" style="background:#1565C0"></span>
        <span class="col-name">行业趋势</span>
        <span class="col-count" id="col-count-industry"></span>
      </div>
      <div class="col-body" id="col-industry"></div>
    </div>
    <div class="kanban-col">
      <div class="col-header">
        <span class="col-dot" style="background:#2E7D32"></span>
        <span class="col-name">市场动态</span>
        <span class="col-count" id="col-count-market"></span>
      </div>
      <div class="col-body" id="col-market"></div>
    </div>
    <div class="kanban-col">
      <div class="col-header">
        <span class="col-dot" style="background:#E65100"></span>
        <span class="col-name">同行新闻</span>
        <span class="col-count" id="col-count-competitor"></span>
      </div>
      <div class="col-body" id="col-competitor"></div>
    </div>
    <div class="kanban-col">
      <div class="col-header">
        <span class="col-dot" style="background:#7C3AED"></span>
        <span class="col-name">产品技术</span>
        <span class="col-count" id="col-count-product"></span>
      </div>
      <div class="col-body" id="col-product"></div>
    </div>
  </div>

  <div class="load-status" id="load-status"></div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/rhc-config.js?v=20260903b"></script>
<script src="assets/rhc-insights.js?v=20260903a"></script>
<script>
/* ============================================================
 * 新闻中心：四列资讯看板 + 滚动分批加载 + 手动刷新
 * 数据来源：后端 /api/insights（RSS 定时抓取 + LLM 翻译分类）
 *   后端不可用时自动降级到 assets/rhc-insights.js 本地数据
 * 手动刷新：POST /api/insights/refresh（后端立即抓一轮 RSS，
 *   10 分钟限频，新增新闻 LLM 翻译分类后入库返回）
 * ============================================================ */
var API = {
  list: '/api/insights',
  refresh: '/api/insights/refresh'
};
var _dataSource = 'api';   // 'api' | 'local'

function apiFetch(url, opts) {
  return fetch(url, opts).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

function applyData(items, lastRefresh) {
  window.RHC_INSIGHT_DATA = items;
  if (lastRefresh) window.__LAST_REFRESH = lastRefresh;
  buildData();
  loadMore(true);
}

function showOffline() {
  _dataSource = 'local';
  document.getElementById('load-status').innerHTML =
    '<span style="color:var(--color-warning,#E65100)">新闻服务暂时不可用，请稍后点击右上角「刷新」重试</span>';
}

// 后端刷新时间（北京时间 "YYYY-MM-DD HH:MM"）→ "MM/DD HH:MM"
function formatRefreshTime(lr) {
  if (lr && lr.time) return lr.time.slice(5).replace('-', '/');
  return '';
}

var CATS = [
  { key:'industry',   label:'行业趋势' },
  { key:'market',     label:'市场动态' },
  { key:'competitor', label:'同行新闻' },
  { key:'product',    label:'产品技术' }
];
var COL_BATCH = 2;          // 每列每批加载条数
var _colData = {};          // cat -> 按日期倒序的新闻数组
var _colLoaded = {};        // cat -> 已加载条数
var _loading = false;
var toastTimer = null;

var REGION_LABELS = {
  'global':'全球','north-america':'北美','europe':'欧洲','africa':'非洲',
  'middle-east':'中东','southeast-asia':'东南亚','brazil':'巴西',
  'china':'中国','asia':'亚洲'
};

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' toast-' + type : '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = 'toast' + (type ? ' toast-' + type : ''); }, 2600);
}

function getSavedIds() {
  try { var s = localStorage.getItem('rhc_saved_insights'); if (s) return JSON.parse(s); } catch(e) {}
  return [];
}
function setSavedIds(arr) { localStorage.setItem('rhc_saved_insights', JSON.stringify(arr)); }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function _getInsightNewsPrefs() {
  try {
    var cfg = (typeof RHC_CONFIG !== 'undefined') ? RHC_CONFIG.get() : {};
    var n = cfg.news || {};
    return {
      categories: n.categories || ['industry','market','competitor','product'],
      focusKw: (n.focusKeywords || '').toLowerCase().split(/[,，]/).map(function(s){return s.trim()}).filter(Boolean),
      blockKw: (n.blockKeywords || '').toLowerCase().split(/[,，]/).map(function(s){return s.trim()}).filter(Boolean),
      pageSize: n.pageSize || 12,
      sortBy: n.sortBy || 'date'
    };
  } catch(e) { return { categories: ['industry','market','competitor','product'], focusKw: [], blockKw: [], pageSize: 12, sortBy: 'date' }; }
}

function buildData() {
  var np = _getInsightNewsPrefs();
  /* 动态调整 COL_BATCH */
  COL_BATCH = Math.max(2, Math.ceil(np.pageSize / CATS.length));
  CATS.forEach(function(c){
    var items = RHC_INSIGHT_DATA.filter(function(it){ return it.category === c.key; });
    /* 屏蔽关键词 */
    if (np.blockKw.length) {
      items = items.filter(function(it) {
        var blob = ((it.title || '') + ' ' + (it.summary || '')).toLowerCase();
        for (var i = 0; i < np.blockKw.length; i++) {
          if (blob.indexOf(np.blockKw[i]) !== -1) return false;
        }
        return true;
      });
    }
    /* 排序 */
    if (np.sortBy === 'relevance' && np.focusKw.length) {
      items.sort(function(a, b) {
        var blobA = ((a.title || '') + ' ' + (a.summary || '')).toLowerCase();
        var blobB = ((b.title || '') + ' ' + (b.summary || '')).toLowerCase();
        var sA = 0, sB = 0;
        for (var i = 0; i < np.focusKw.length; i++) {
          if (blobA.indexOf(np.focusKw[i]) !== -1) sA++;
          if (blobB.indexOf(np.focusKw[i]) !== -1) sB++;
        }
        if (sA !== sB) return sB - sA;
        return b.date.localeCompare(a.date);
      });
    } else {
      items.sort(function(a, b){ return b.date.localeCompare(a.date); });
    }
    _colData[c.key] = items;
    _colLoaded[c.key] = 0;
    /* 分类是否启用：未启用则显示 0 */
    var catEnabled = np.categories.indexOf(c.key) !== -1;
    document.getElementById('col-count-' + c.key).textContent = catEnabled ? items.length : 0;
    if (!catEnabled) _colData[c.key] = [];
  });
  var total = 0;
  CATS.forEach(function(c){ total += _colData[c.key].length; });
  document.getElementById('board-count').textContent = total;
  var t = formatRefreshTime(window.__LAST_REFRESH);
  document.getElementById('board-latest').textContent = t || '—';
}

function cardHtml(item) {
  var saved = getSavedIds();
  var isSaved = saved.indexOf(item.id) !== -1;
  var title = item.url
    ? '<a class="news-card-title" href="' + item.url + '" target="_blank" rel="noopener">' + esc(item.title) + '</a>'
    : '<div class="news-card-title">' + esc(item.title) + '</div>';
  var regions = (item.regions || []).slice(0, 2).map(function(r){
    return '<span class="news-region-tag">' + esc(REGION_LABELS[r] || r) + '</span>';
  }).join('');
  return '<div class="news-card">'
    + '<div class="news-card-date">' + esc(item.date) + '</div>'
    + title
    + '<div class="news-card-foot">'
    +   regions
    +   '<button class="news-bookmark-btn' + (isSaved ? ' saved' : '') + '" onclick="toggleSave(\'' + item.id + '\')" title="' + (isSaved ? '取消收藏' : '收藏到素材库') + '" aria-label="收藏">'
    +     '<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>'
    +   '</button>'
    + '</div>'
    + '</div>';
}

function renderCol(catKey, reset) {
  var body = document.getElementById('col-' + catKey);
  if (reset) { body.innerHTML = ''; _colLoaded[catKey] = 0; }
  var all = _colData[catKey];
  var next = all.slice(_colLoaded[catKey], _colLoaded[catKey] + COL_BATCH);
  var html = '';
  for (var i = 0; i < next.length; i++) html += cardHtml(next[i]);
  body.insertAdjacentHTML('beforeend', html);
  _colLoaded[catKey] += next.length;
}

function totalLoaded() {
  var t = 0;
  CATS.forEach(function(c){ t += _colLoaded[c.key]; });
  return t;
}
function allDone() {
  return CATS.every(function(c){ return _colLoaded[c.key] >= _colData[c.key].length; });
}

function nearBottom() {
  var status = document.getElementById('load-status');
  var rect = status.getBoundingClientRect();
  return rect.top < window.innerHeight + 120;
}

function loadMore(reset, cb) {
  if (_loading) return;
  if (!reset && allDone()) { if (cb) cb(); return; }
  _loading = true;
  var status = document.getElementById('load-status');
  status.innerHTML = '<span class="spinner"></span>加载中...';
  // 模拟异步加载（后期接 RSS/后端接口时，替换为真实分页请求）
  setTimeout(function(){
    CATS.forEach(function(c){ renderCol(c.key, reset); });
    if (allDone()) {
      status.textContent = '— 已加载全部 ' + RHC_INSIGHT_DATA.length + ' 条资讯 —';
    } else {
      status.textContent = '下滑加载更多（已加载 ' + totalLoaded() + '/' + RHC_INSIGHT_DATA.length + '）';
    }
    _loading = false;
    // 首屏未满时自动继续加载（数据少、页面无滚动条时，scroll 事件不会触发）
    if (!allDone() && nearBottom()) {
      loadMore(false, cb);
    } else if (cb) {
      cb();
    }
  }, reset ? 400 : 300);
}

function refreshBoard() {
  var btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  document.getElementById('load-status').innerHTML = '<span class="spinner"></span>正在抓取最新新闻...';
  window.scrollTo({ top: 0, behavior: 'smooth' });

  if (_dataSource === 'local') {
    // 离线模式下点刷新：重新尝试连接后端
    _dataSource = 'api';
  }

  var beforeTotal = RHC_INSIGHT_DATA.length;
  var beforeSig = window.__LAST_REFRESH && window.__LAST_REFRESH.time ? window.__LAST_REFRESH.time : '';

  function finishList(){
    return apiFetch(API.list).then(function(res){
      if (res && res.items && res.items.length) {
        _dataSource = 'api';
        var n = res.items.length - beforeTotal;
        applyData(res.items, res.last_refresh);
        if (n > 0) showToast('刷新完成，新增 ' + n + ' 条新闻，共 ' + res.items.length + ' 条', 'success');
        else showToast('已是最新，共 ' + res.items.length + ' 条', 'success');
      }
    });
  }

  // 轮询：后端两阶段发布——英文新闻 ~20 秒先上，中文版 ~2 分钟替换。
  // 每轮拉列表，内容有更新就即时渲染，refreshing 结束后收尾。
  var waits = 0;
  function poll(){
    apiFetch(API.list).then(function(res){
      if (res && res.items && res.items.length) {
        var changed = res.items.length !== RHC_INSIGHT_DATA.length ||
          (res.last_refresh && window.__LAST_REFRESH && res.last_refresh.time !== window.__LAST_REFRESH.time);
        if (changed) {
          applyData(res.items, res.last_refresh);
        }
      }
      return apiFetch('/api/insights/status').then(function(st){
        if (st && st.refreshing) {
          if (waits++ < 40) { setTimeout(poll, 5000); return; }  // 最多等 ~3.5 分钟
        }
        var total = res && res.items ? res.items.length : RHC_INSIGHT_DATA.length;
        var n = total - beforeTotal;
        if (n > 0) showToast('刷新完成，新增 ' + n + ' 条新闻，共 ' + total + ' 条', 'success');
        else showToast('已是最新，共 ' + total + ' 条', 'success');
        btn.classList.remove('spinning');
      });
    }).catch(function(){
      if (waits++ < 40) { setTimeout(poll, 5000); return; }
      showToast('刷新失败，新闻服务暂不可用', 'warning');
      showOffline();
      btn.classList.remove('spinning');
    });
  }

  // 触发后端后台抓取一轮 RSS（立即受理；10 分钟限频）
  apiFetch(API.refresh, { method: 'POST' })
    .then(function(res){
      if (res && res.accepted) {
        showToast('正在抓取最新新闻，内容将陆续更新...', 'success');
        poll();
      } else if (res && res.reason === 'rate_limited') {
        var mins = Math.ceil(res.remain_seconds / 60);
        showToast('刷新过于频繁，请 ' + mins + ' 分钟后再试（已加载最新列表）', 'warning');
        finishList().finally(function(){ btn.classList.remove('spinning'); });
      } else {
        showToast('已有刷新任务在进行中...', 'warning');
        poll();
      }
    })
    .catch(function(){
      showToast('刷新失败，新闻服务暂不可用', 'warning');
      showOffline();
      btn.classList.remove('spinning');
    });
}

function toggleSave(id) {
  var saved = getSavedIds();
  var idx = saved.indexOf(id);
  if (idx !== -1) { saved.splice(idx, 1); showToast('已取消收藏'); }
  else { saved.push(id); showToast('已收藏到个人素材库', 'success'); }
  setSavedIds(saved);
  // 重渲染四列已加载部分的收藏按钮状态
  CATS.forEach(function(c){
    var body = document.getElementById('col-' + c.key);
    var html = '';
    for (var i = 0; i < _colLoaded[c.key]; i++) html += cardHtml(_colData[c.key][i]);
    body.innerHTML = html;
  });
}

var _resizeTimer = null;
function onScroll() {
  if (_loading || allDone()) return;
  if (nearBottom()) loadMore(false);
}

document.addEventListener('DOMContentLoaded', function(){
  // 数据唯一来源为后端 /api/insights；加载期间显示 loading，不用本地快照
  document.getElementById('load-status').innerHTML = '<span class="spinner"></span>正在加载新闻...';
  window.addEventListener('scroll', onScroll);
  // 窗口变大（如旋转、外接显示器）导致首屏变空时，自动补载填满
  window.addEventListener('resize', function(){
    if (_resizeTimer) clearTimeout(_resizeTimer);
    _resizeTimer = setTimeout(function(){
      if (!_loading && !allDone() && nearBottom()) loadMore(false);
    }, 250);
  });

  // 拉取后端数据（RSS 抓取入库 + LLM 翻译分类）
  // 服务刚启动时首轮抓取+翻译约需 2-3 分钟，期间返回空列表，自动重试覆盖
  (function initLoad(retries) {
    apiFetch(API.list).then(function(res){
      if (res && res.items && res.items.length) {
        _dataSource = 'api';
        applyData(res.items, res.last_refresh);
      } else if (retries > 0) {
        setTimeout(function(){ initLoad(retries - 1); }, 5000);
      } else {
        showOffline();
      }
    }).catch(function(){
      if (retries > 0) setTimeout(function(){ initLoad(retries - 1); }, 5000);
      else showOffline();
    });
  })(40);

  // 自动更新：每 10 分钟静默检查一次后端是否有新内容
  setInterval(function(){
    if (_dataSource !== 'api') return;
    apiFetch(API.list).then(function(res){
      if (res && res.items && res.items.length) {
        var sig = res.items.length + '|' + (res.last_refresh && res.last_refresh.time ? res.last_refresh.time : '');
        var oldSig = RHC_INSIGHT_DATA.length + '|' + (window.__LAST_REFRESH && window.__LAST_REFRESH.time ? window.__LAST_REFRESH.time : '');
        if (sig !== oldSig) {
          applyData(res.items, res.last_refresh);
          showToast('已自动更新，共 ' + res.items.length + ' 条新闻', 'success');
        }
      }
    }).catch(function(){});
  }, 10 * 60 * 1000);
});

</script>
