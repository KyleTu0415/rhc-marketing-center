<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="assets/rhc-fonts.css">

<title>RHC 安瑞康 — 订单履约中心</title>
<style>
:root{
  --color-bg:#F7F8FA; --color-surface:#FFFFFF;
  --color-primary:#C8102E; --color-primary-dark:#A50D26;
  --color-primary-light:#FDE8EB; --color-primary-xlight:#FFF1F3;
  --color-text:#1A1A1A; --color-text-secondary:#6B7280; --color-text-tertiary:#9CA3AF;
  --color-border:#E5E7EB; --color-border-light:#F3F4F6;
  --color-success:#16A37B; --color-warning:#F3A94B; --color-danger:#E5484D; --color-info:#3B82F6;
  --font-sans:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06); --shadow-md:0 4px 12px rgba(0,0,0,0.08); --shadow-lg:0 8px 24px rgba(0,0,0,0.10);
  --transition-fast:0.15s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--color-text);background:var(--color-bg);overflow:hidden}
a{color:var(--color-primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--font-sans);cursor:pointer;border:none;background:none;font-size:13px}
input,select,textarea{font-family:var(--font-sans);font-size:13px;border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--color-text);background:var(--color-surface);outline:none;transition:border-color var(--transition-fast)}
input:focus,select:focus,textarea:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(200,16,46,0.12)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--color-text-tertiary)}

.app-layout{display:flex;height:100vh;width:100vw}
.sidebar{width:200px;min-width:200px;background:var(--color-surface);border-right:1px solid var(--color-border);display:flex;flex-direction:column;overflow-y:auto;z-index:100}
.sidebar-logo{padding:15px 0 20px;text-align:left}
.sidebar-logo img{height:90px;width:auto;margin:0 auto;display:block}
.sidebar-logo span{display:block;font-size:13px;font-weight:700;color:var(--color-primary);margin-top:10px;letter-spacing:2px;text-transform:uppercase}
.sidebar-nav{flex:1;display:flex;flex-direction:column}
.sidebar-nav .nav-section{padding:4px 16px 10px;font-size:15px;letter-spacing:0.5px;color:var(--color-text-secondary);font-weight:700;text-align:left}
.sidebar-nav .nav-item{display:flex;align-items:center;gap:8px;padding:7px 16px;color:#6B7280;font-size:13px;font-weight:500;cursor:pointer;transition:all var(--transition-fast);border-left:3px solid transparent;text-decoration:none;position:relative}
.sidebar-nav a.nav-item:hover{text-decoration:none}
.sidebar-nav .nav-item:hover{background:var(--color-primary-xlight);color:var(--color-primary)}
.sidebar-nav .nav-item.active{background:var(--color-primary-xlight);color:var(--color-primary);font-weight:600;border-left-color:var(--color-primary)}
.sidebar-nav .nav-item .nav-icon{width:14px;height:14px;flex-shrink:0;color:var(--color-text-tertiary);opacity:0.7}
.sidebar-nav .nav-item:hover .nav-icon,.sidebar-nav .nav-item.active .nav-icon{color:var(--color-primary)}
.sidebar-nav .nav-item-back-home{border-top:1px solid var(--color-border-light);margin-top:auto;padding-top:11px}
.nav-item.nav-item-back-home,.nav-item.nav-item-back-home .nav-icon{color:var(--color-primary);font-weight:600;font-size:14px;opacity:1}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--color-border-light)}
.sidebar-user{display:flex;align-items:center;gap:8px}
.sidebar-user .avatar{width:30px;height:30px;border-radius:50%;background:var(--color-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
.sidebar-user .user-name{font-size:13px;font-weight:600}
.sidebar-user .user-role{font-size:11px;color:var(--color-text-tertiary)}
.main-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.page{display:none;animation:fadeIn 0.3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-header{margin-bottom:24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.page-header h2{font-size:18px;font-weight:700;color:var(--color-text);margin:0 0 4px}
.page-header p{margin:0;font-size:14px;color:var(--color-text-secondary)}
.page-header-actions{display:flex;align-items:center;gap:12px;flex-shrink:0}
.content-area{flex:1;overflow-y:auto;padding:20px 28px 28px;scroll-behavior:smooth}

.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.2px;white-space:nowrap}
.tag-success{background:#E6F9F1;color:#0D7B57}
.tag-warning{background:#FFF4E0;color:#B27A1B}
.tag-gray{background:#F0F2F3;color:#637089}
.tag-primary{background:var(--color-primary-light);color:var(--color-primary-dark)}
.tag-info{background:#E8F0FE;color:#1A56C4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;transition:all var(--transition-fast)}
.btn-primary{background:var(--color-primary);color:#fff}
.btn-primary:hover{background:var(--color-primary-dark)}
.btn-outline{border:1px solid var(--color-border);color:var(--color-text-secondary);background:var(--color-surface)}
.btn-outline:hover{border-color:var(--color-primary);color:var(--color-primary)}
.btn-sm{padding:6px 12px;font-size:12px}

.notice-bar{display:flex;gap:10px;align-items:flex-start;background:#FFF8EC;border:1px solid #F5DFB0;color:#8A6116;border-radius:var(--radius-md);padding:12px 16px;font-size:12.5px;line-height:1.6;margin-bottom:16px}
.notice-bar svg{width:16px;height:16px;flex-shrink:0;margin-top:2px}

/* kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:stretch}
.kcol{flex:0 0 218px;background:var(--color-bg);border:1px solid var(--color-border-light);border-radius:var(--radius-md);display:flex;flex-direction:column;max-height:calc(100vh - 240px)}
.kcol-head{padding:10px 12px;border-bottom:1px solid var(--color-border-light);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--color-bg);border-radius:var(--radius-md) var(--radius-md) 0 0}
.kcol-head .kc-name{font-size:12px;font-weight:700;line-height:1.35}
.kcol-head .kc-count{margin-left:auto;font-size:11px;font-weight:700;background:var(--color-surface);border:1px solid var(--color-border);border-radius:10px;padding:1px 8px;color:var(--color-text-secondary)}
.kcol-head.kc-final{background:#E6F9F1;border-bottom-color:#CDEFE2}
.kcol-head.kc-final .kc-name{color:#0D7B57}
.kcol-body{padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.kcard{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:10px 12px;cursor:pointer;transition:all var(--transition-fast);box-shadow:var(--shadow-sm)}
.kcard:hover{border-color:var(--color-primary);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.kcard .kc-no{font-size:12px;font-weight:700;color:var(--color-primary)}
.kcard .kc-cust{font-size:12.5px;font-weight:600;margin-top:4px;line-height:1.35}
.kcard .kc-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}
.kcard .kc-country{font-size:11px;color:var(--color-text-tertiary)}
.kcard .kc-amount{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.kcol-empty{font-size:11px;color:var(--color-text-tertiary);text-align:center;padding:16px 6px}

/* list table */
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table thead{background:var(--color-bg)}
.data-table th{text-align:left;padding:12px 16px;font-weight:600;font-size:12px;color:var(--color-text-secondary);letter-spacing:0.4px;border-bottom:1px solid var(--color-border);white-space:nowrap}
.data-table td{padding:13px 16px;border-bottom:1px solid var(--color-border-light);vertical-align:middle}
.data-table tbody tr{transition:background var(--transition-fast);cursor:pointer}
.data-table tbody tr:hover{background:var(--color-primary-xlight)}

/* modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-card{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:760px;max-height:90vh;overflow-y:auto}
.modal-header{padding:18px 24px;border-bottom:1px solid var(--color-border-light);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--color-surface);z-index:2}
.modal-header h3{font-size:16px;font-weight:700}
.modal-close{font-size:22px;color:var(--color-text-tertiary);cursor:pointer;line-height:1;background:none;border:none}
.modal-close:hover{color:var(--color-text)}
.modal-body{padding:20px 24px}
.modal-footer{padding:14px 24px;border-top:1px solid var(--color-border-light);display:flex;justify-content:flex-end}

.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin-bottom:20px}
.detail-item{font-size:13px}
.detail-item .di-label{font-size:11px;color:var(--color-text-tertiary);margin-bottom:2px}
.detail-item.wide{grid-column:1/-1}

/* timeline */
.timeline{list-style:none;position:relative;margin-left:8px}
.timeline li{position:relative;padding:0 0 22px 30px;min-height:8px}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:'';position:absolute;left:9px;top:20px;bottom:-4px;width:2px;background:var(--color-border)}
.timeline li:last-child::before{display:none}
.tl-dot{position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--color-border);border:3px solid var(--color-border-light);z-index:1}
.timeline li.done .tl-dot{background:var(--color-primary);border-color:var(--color-primary-light)}
.timeline li.done::before{background:var(--color-primary)}
.timeline li.current .tl-dot{background:var(--color-primary);border-color:var(--color-primary-light);box-shadow:0 0 0 0 rgba(200,16,46,0.45);animation:pulse 1.6s infinite}
.timeline li.final .tl-dot{background:var(--color-success);border-color:#CDEFE2}
.timeline li.final::before{background:var(--color-success)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,16,46,0.45)}70%{box-shadow:0 0 0 9px rgba(200,16,46,0)}100%{box-shadow:0 0 0 0 rgba(200,16,46,0)}}
.tl-name{font-size:13px;font-weight:600;color:var(--color-text-tertiary)}
.timeline li.done .tl-name,.timeline li.current .tl-name{color:var(--color-text)}
.timeline li.final .tl-name{color:var(--color-success)}
.timeline li.current .tl-name{color:var(--color-primary)}
.tl-tag{font-size:10px;font-weight:700;margin-left:8px;padding:1px 8px;border-radius:10px}
.tl-tag.tag-cur{background:var(--color-primary-light);color:var(--color-primary-dark)}
.tl-tag.tag-end{background:#E6F9F1;color:#0D7B57}
.tl-sub{font-size:11px;color:var(--color-text-tertiary);margin-top:2px}
.tl-note{font-size:11px;color:var(--color-text-tertiary);margin-top:4px;padding:6px 10px;background:var(--color-bg);border-radius:6px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--color-text);color:#fff;padding:12px 24px;border-radius:var(--radius-md);font-size:13px;font-weight:500;z-index:2000;opacity:0;transition:all .3s ease;box-shadow:var(--shadow-lg);pointer-events:none;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.state-message{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 20px;gap:10px;color:var(--color-text-secondary);font-size:13px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px 64px;gap:6px}
.empty-state .es-icon{width:64px;height:64px;border-radius:50%;background:var(--color-primary-xlight);border:1px dashed var(--color-primary-light);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.empty-state .es-title{font-size:15px;font-weight:700;color:var(--color-text)}
.empty-state .es-desc{font-size:13px;color:var(--color-text-secondary);max-width:440px;line-height:1.7}
.empty-state .es-value{font-size:12.5px;color:var(--color-text-tertiary);max-width:440px;line-height:1.7;margin-top:2px}
.loading-row{display:flex;align-items:center;gap:10px;color:var(--color-text-secondary);font-size:13px;padding:40px 0;justify-content:center}
.loading-spinner{width:20px;height:20px;border:2.5px solid var(--color-border);border-top-color:var(--color-primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:860px){
  .sidebar{width:56px;min-width:56px}
  .sidebar .sidebar-logo span,.sidebar .nav-item span,.sidebar .nav-section,.sidebar .sidebar-user .user-info{display:none}
  .sidebar-logo{padding:16px 8px;text-align:left}
  .sidebar-logo img{height:28px;margin:0 auto}
  .sidebar-nav .nav-item{padding:12px 0;justify-content:center;border-left:none;border-bottom:2px solid transparent}
  .sidebar-nav .nav-item.active{border-bottom-color:var(--color-primary)}
  .content-area{padding:16px}
  .detail-grid{grid-template-columns:1fr}
  .kcol{flex:0 0 180px}
  .data-table{font-size:12px}
  .data-table th,.data-table td{padding:10px 10px}
}
</style>
</head>
<body>
<div class="app-layout">
<nav class="sidebar" aria-label="主导航">
  <div class="sidebar-logo"><img src="https://iili.io/CZ0tVNn.png" alt="RHC Medical"></div>
  <div class="sidebar-nav">
    <div class="nav-section">订单履约中心</div>
    <div class="nav-item active" data-page="kanban" onclick="switchPage('kanban',this)" role="button" tabindex="0"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg><span>履约看板</span></div>
    <div class="nav-item" data-page="list" onclick="switchPage('list',this)" role="button" tabindex="0"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg><span>订单列表</span></div>
    <div class="nav-item nav-item-back-home" onclick="window.location.href='panel.html'" role="button" tabindex="0"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>返回门户</span></div>
  </div>
</nav>
<div class="main-area">
    <main class="content-area">
    <section class="page active" id="page-kanban">
    <div class="page-header">
      <div><h2>履约看板</h2><p>按履约节点跟踪订单进度</p></div>
    </div>
    <div class="notice-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <div>完整履约操作（配置确认 / 单据上传 / 提货 / 报关）请使用全流程演示系统；本中心提供管理视角的订单状态总览。点击任意订单卡片可查看履约时间线。</div>
    </div>
    <div id="kanban-area"><div class="loading-row"><span class="loading-spinner"></span> 正在加载订单数据…</div></div>
    </section>

    <section class="page" id="page-list">
    <div class="page-header">
      <div><h2>订单列表</h2><p>全部订单明细与单据管理</p></div>
    </div>
    <div id="list-area"><div class="loading-row"><span class="loading-spinner"></span> 正在加载订单数据…</div></div>
    </section>
  </main>
</div>
</div>

<div class="modal-overlay" id="detail-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-card">
    <div class="modal-header"><h3 id="detail-title">订单详情</h3><button class="modal-close" onclick="closeModal()" aria-label="关闭">&times;</button></div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
function switchPage(pageId,el){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});var t=document.getElementById('page-'+pageId);if(t){t.classList.remove('active');void t.offsetWidth;t.classList.add('active')}document.querySelectorAll('.sidebar-nav .nav-item').forEach(function(n){n.classList.remove('active')});if(el)el.classList.add('active');var ca=document.querySelector('.content-area');if(ca)ca.scrollTop=0}
document.querySelectorAll('.sidebar-nav .nav-item').forEach(function(item){item.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();item.click()}})});
var ORDER_STATUSES=['已成交','单据制作中','待配置校验','已发仓库待配货','可提货','已提货','报关中·已进仓','已发运','已完成'];
var snapshotData=null;
var toastTimer=null;
function showToast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(type?' toast-'+type:'');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className='toast'+(type?' toast-'+type:'')},3200)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var ICON_KANBAN='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/><line x1="20" y1="16" x2="20" y2="22"/></svg>';
var ICON_LIST='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>';
function emptyStateHtml(icon,title,desc,value){
  return '<div class="empty-state"><div class="es-icon">'+icon+'</div>'+
    '<div class="es-title">'+esc(title)+'</div>'+
    '<div class="es-desc">'+esc(desc)+'</div>'+
    (value?'<div class="es-value">'+esc(value)+'</div>':'')+'</div>';
}
function closeModal(){document.getElementById('detail-modal').classList.remove('show')}
function openModal(){document.getElementById('detail-modal').classList.add('show')}
function statusTag(s){
  if(s==='已完成')return '<span class="tag tag-success">'+esc(s)+'</span>';
  if(s==='已成交')return '<span class="tag tag-primary">'+esc(s)+'</span>';
  if(s==='可提货')return '<span class="tag tag-warning">'+esc(s)+'</span>';
  if(s==='已发运')return '<span class="tag tag-info">'+esc(s)+'</span>';
  return '<span class="tag tag-gray">'+esc(s)+'</span>';
}

function render(){
  if(!snapshotData)return;
  var orders=snapshotData.orders||[];
  renderKanban(orders);
  renderList(orders);
}

function renderKanban(orders){
  var ka=document.getElementById('kanban-area');if(!ka)return;
  if(orders.length===0){
    ka.innerHTML=emptyStateHtml(ICON_KANBAN,
      '暂无订单',
      '订单数据接入飞书多维表后自动汇聚',
      '可查看 9 大履约节点（已成交 → 单据制作 → 配置校验 → 仓库配货 → 提货 → 报关 → 发运 → 完成）全程跟踪，每笔订单的履约状态与进度一目了然');
    return;
  }
  var html='<div class="kanban">'+ORDER_STATUSES.map(function(st){
    var list=orders.filter(function(o){return o['当前状态']===st});
    var isFinal=st==='已完成';
    return '<div class="kcol"><div class="kcol-head'+(isFinal?' kc-final':'')+'"><span class="kc-name">'+esc(st)+'</span><span class="kc-count">'+list.length+'</span></div>'+
      '<div class="kcol-body">'+
      (list.length?list.map(function(o){
        return '<div class="kcard" onclick="openDetail(\''+esc(o['订单号'])+'\')">'+
          '<div class="kc-no">'+esc(o['订单号'])+'</div>'+
          '<div class="kc-cust">'+esc(o['客户名称'])+'</div>'+
          '<div class="kc-meta"><span class="kc-country">'+esc(o['国家/地区'])+'</span><span class="kc-amount">'+esc(o['订单金额（原币）'])+'</span></div>'+
        '</div>';
      }).join(''):'<div class="kcol-empty">暂无订单</div>')+
      '</div></div>';
  }).join('')+'</div>';
  ka.innerHTML=html;
}

function renderList(orders){
  var la=document.getElementById('list-area');if(!la)return;
  if(orders.length===0){
    la.innerHTML='<div class="card">'+emptyStateHtml(ICON_LIST,
      '暂无订单',
      '订单数据接入飞书多维表后自动汇聚',
      '订单号、客户、金额、当前履约节点与负责销售明细自动同步；点击任意订单可查看 9 大节点履约时间线')+'</div>';
    return;
  }
  la.innerHTML=
    '<div class="card"><table class="data-table"><thead><tr>'+
      '<th>订单号</th><th>客户</th><th>国家/地区</th><th>订单金额（原币）</th><th>当前状态</th><th>下单日期</th><th>负责销售</th>'+
    '</tr></thead><tbody>'+
    orders.map(function(o){
      return '<tr onclick="openDetail(\''+esc(o['订单号'])+'\')">'+
        '<td style="font-weight:600;color:var(--color-primary)">'+esc(o['订单号'])+'</td>'+
        '<td>'+esc(o['客户名称'])+'</td>'+
        '<td>'+esc(o['国家/地区'])+'</td>'+
        '<td style="font-variant-numeric:tabular-nums;font-weight:600">'+esc(o['订单金额（原币）'])+'</td>'+
        '<td>'+statusTag(o['当前状态'])+'</td>'+
        '<td style="white-space:nowrap;color:var(--color-text-secondary)">'+esc(o['下单日期'])+'</td>'+
        '<td>'+esc(o['负责销售'])+'</td>'+
      '</tr>';
    }).join('')+
    '</tbody></table></div>';
}

function openDetail(no){
  var o=(snapshotData.orders||[]).filter(function(x){return x['订单号']===no})[0];
  if(!o)return;
  document.getElementById('detail-title').textContent='订单详情 · '+o['订单号'];
  var curIdx=ORDER_STATUSES.indexOf(o['当前状态']);
  var tl=ORDER_STATUSES.map(function(st,i){
    var cls=i<curIdx?'done':(i===curIdx?'current':'');
    if(st==='已完成'&&i<=curIdx)cls=i===curIdx?'current final':'done final';
    var tag=i===curIdx?(st==='已完成'?'<span class="tl-tag tag-end">已完成</span>':'<span class="tl-tag tag-cur">当前节点</span>'):'';
    var sub=i===curIdx?'<div class="tl-sub">当前处于该履约节点</div>':(i<curIdx?'<div class="tl-sub">已完成</div>':'<div class="tl-sub">待流转</div>');
    return '<li class="'+cls+'"><span class="tl-dot"></span><div class="tl-name">'+esc(st)+tag+'</div>'+sub+'</li>';
  }).join('');
  document.getElementById('detail-body').innerHTML=
    '<div class="detail-grid">'+
      '<div class="detail-item"><div class="di-label">订单号</div><div>'+esc(o['订单号'])+'</div></div>'+
      '<div class="detail-item"><div class="di-label">当前状态</div><div>'+statusTag(o['当前状态'])+'</div></div>'+
      '<div class="detail-item"><div class="di-label">客户名称</div><div>'+esc(o['客户名称'])+'</div></div>'+
      '<div class="detail-item"><div class="di-label">国家/地区</div><div>'+esc(o['国家/地区'])+'</div></div>'+
      '<div class="detail-item"><div class="di-label">订单金额（原币）</div><div style="font-weight:700;font-variant-numeric:tabular-nums">'+esc(o['订单金额（原币）'])+'</div></div>'+
      '<div class="detail-item"><div class="di-label">下单日期</div><div>'+esc(o['下单日期'])+'</div></div>'+
      '<div class="detail-item"><div class="di-label">负责销售</div><div>'+esc(o['负责销售'])+'</div></div>'+
      '<div class="detail-item wide"><div class="di-label">产品明细</div><div>'+esc(o['产品明细'])+'</div></div>'+
      '<div class="detail-item wide"><div class="di-label">备注</div><div>'+(o['备注']?esc(o['备注']):'—')+'</div></div>'+
    '</div>'+
    '<h4 style="font-size:12px;font-weight:600;color:var(--color-text-secondary);letter-spacing:0.5px;margin-bottom:14px">履约状态时间线（9 节点）</h4>'+
    '<ul class="timeline">'+tl+'</ul>';
  openModal();
}

fetch('data/snapshot.json',{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .then(function(d){snapshotData=d;render()})
  .catch(function(){
    var failHtml='<div class="card"><div class="state-message"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-warning)" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><div style="font-weight:600;color:var(--color-text)">数据加载失败</div><div>无法读取 data/snapshot.json，请通过本地 HTTP 服务访问本页面。</div><button class="btn btn-outline btn-sm" onclick="location.reload()">重新加载</button></div></div>';
    var ka=document.getElementById('kanban-area');if(ka)ka.innerHTML=failHtml;
    var la=document.getElementById('list-area');if(la)la.innerHTML=failHtml;
  });
</script>
