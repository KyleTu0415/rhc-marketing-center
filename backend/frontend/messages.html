<!doctype html>
<html lang="zh-CN">
<head>
<script>
(function(){
  var token = localStorage.getItem('rhc_auth_token');
  if(!token) { window.location.href = 'login.html'; return; }
})();
</script>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="assets/rhc-fonts.css">
<title>消息中心 — Real Healthcare 智能工作平台</title>
<style>
:root{
  --color-bg:#F7F8FA; --color-surface:#FFFFFF;
  --color-primary:#C8102E; --color-primary-dark:#A50D26;
  --color-primary-light:#FDE8EB; --color-primary-xlight:#FFF1F3;
  --color-text:#1A1A1A; --color-text-secondary:#6B7280; --color-text-tertiary:#9CA3AF;
  --color-border:#E5E7EB; --color-border-light:#F3F4F6;
  --color-success:#16A37B; --color-warning:#F3A94B; --color-danger:#E5484D; --color-info:#3B82F6;
  --font-sans:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06); --shadow-md:0 4px 12px rgba(0,0,0,0.08); --shadow-lg:0 8px 24px rgba(0,0,0,0.10);
  --transition-fast:0.15s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--color-text);background:var(--color-bg);overflow:hidden}
a{color:var(--color-primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--font-sans);cursor:pointer;border:none;background:none;font-size:13px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--color-text-tertiary)}

.app-layout{display:flex;height:100vh;width:100vw}
.sidebar{width:200px;min-width:200px;background:var(--color-surface);border-right:1px solid var(--color-border);display:flex;flex-direction:column;overflow-y:auto;z-index:100}
.sidebar-logo{padding:15px 0 20px;text-align:left}
.sidebar-logo img{height:90px;width:auto;margin:0 auto;display:block}
.sidebar-nav{flex:1;display:flex;flex-direction:column}
.sidebar-nav .nav-section{padding:4px 16px 10px;font-size:15px;letter-spacing:0.5px;color:var(--color-text-secondary);font-weight:700;text-align:left}
.sidebar-nav .nav-item{display:flex;align-items:center;gap:8px;padding:7px 16px;color:#6B7280;font-size:13px;font-weight:500;cursor:pointer;transition:all var(--transition-fast);border-left:3px solid transparent;text-decoration:none;position:relative}
.sidebar-nav a.nav-item:hover{text-decoration:none}
.sidebar-nav .nav-item:hover{background:var(--color-primary-xlight);color:var(--color-primary)}
.sidebar-nav .nav-item.active{background:var(--color-primary-xlight);color:var(--color-primary);font-weight:600;border-left-color:var(--color-primary)}
.sidebar-nav .nav-item .nav-icon{width:14px;height:14px;flex-shrink:0;color:var(--color-text-tertiary);opacity:0.7}
.sidebar-nav .nav-item:hover .nav-icon,.sidebar-nav .nav-item.active .nav-icon{color:var(--color-primary)}
.sidebar-nav .nav-item-back-home{border-top:1px solid var(--color-border-light);margin-top:auto;padding-top:11px}
.nav-item.nav-item-back-home,.nav-item.nav-item-back-home .nav-icon{color:var(--color-primary);font-weight:600;font-size:14px;opacity:1}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--color-border-light)}
.sidebar-user{display:flex;align-items:center;gap:8px}
.sidebar-user .avatar{width:30px;height:30px;border-radius:50%;background:var(--color-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
.sidebar-user .user-name{font-size:13px;font-weight:600}
.sidebar-user .user-role{font-size:11px;color:var(--color-text-tertiary)}

.main-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.content-area{flex:1;overflow-y:auto;padding:20px 28px 28px;scroll-behavior:smooth}

.page-header{margin-bottom:24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.page-header h2{font-size:18px;font-weight:700;color:var(--color-text);margin:0 0 4px}
.page-header p{margin:0;font-size:14px;color:var(--color-text-secondary)}
.page-header-actions{display:flex;align-items:center;gap:12px;flex-shrink:0}

/* Filter tabs */
.msg-filter-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.msg-filter-tab{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 18px;border-radius:20px;
  font-size:13px;font-weight:600;
  color:var(--color-text-secondary);
  background:var(--color-surface);
  border:1px solid var(--color-border);
  cursor:pointer;transition:all var(--transition-fast);
}
.msg-filter-tab:hover{border-color:var(--color-primary);color:var(--color-primary)}
.msg-filter-tab.active{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.msg-filter-tab .tab-count{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:rgba(0,0,0,0.06);font-size:11px;font-weight:700;
}
.msg-filter-tab.active .tab-count{background:rgba(255,255,255,0.25)}

/* Message list */
.msg-list{display:flex;flex-direction:column;gap:12px}

.msg-card{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius-md);
  padding:16px 20px;
  display:flex;align-items:flex-start;gap:14px;
  transition:all var(--transition-fast);
  cursor:default;
}
.msg-card:hover{
  border-color:var(--color-primary);
  box-shadow:var(--shadow-sm);
}
.msg-card.unread{
  background:var(--color-primary-xlight);
  border-color:var(--color-primary-light);
}

.msg-icon{
  width:36px;height:36px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
  background:var(--color-bg);
}
.msg-icon.type-lead{background:#E6F9F1}
.msg-icon.type-system{background:#FFF4E0}
.msg-icon.type-email{background:#E8F0FE}

.msg-content{flex:1;min-width:0}
.msg-title{font-size:14px;font-weight:600;color:var(--color-text);margin-bottom:4px;line-height:1.4}
.msg-card.unread .msg-title::before{
  content:'';display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--color-danger);margin-right:8px;vertical-align:middle;
}
.msg-summary{
  font-size:13px;color:var(--color-text-secondary);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;margin-bottom:8px;
}
.msg-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.msg-time{font-size:12px;color:var(--color-text-tertiary)}
.msg-actions{display:flex;gap:8px;margin-left:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 14px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;transition:all var(--transition-fast);cursor:pointer}
.btn-primary{background:var(--color-primary);color:#fff;border:none}
.btn-primary:hover{background:var(--color-primary-dark)}
.btn-outline{border:1px solid var(--color-border);color:var(--color-text-secondary);background:var(--color-surface)}
.btn-outline:hover{border-color:var(--color-primary);color:var(--color-primary)}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 24px;gap:6px}
.empty-state .es-icon{width:64px;height:64px;border-radius:50%;background:var(--color-primary-xlight);border:1px dashed var(--color-primary-light);display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:28px}
.empty-state .es-title{font-size:15px;font-weight:700;color:var(--color-text)}
.empty-state .es-desc{font-size:13px;color:var(--color-text-secondary);max-width:480px;line-height:1.7}

/* Loading */
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;gap:12px;color:var(--color-text-tertiary);font-size:13px}
.loading-state .spin{width:28px;height:28px;border:3px solid var(--color-border);border-top-color:var(--color-primary);border-radius:50%;animation:rhc-spin .8s linear infinite}
@keyframes rhc-spin{to{transform:rotate(360deg)}}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--color-text);color:#fff;padding:12px 24px;border-radius:var(--radius-md);font-size:13px;font-weight:500;z-index:2000;opacity:0;transition:all .3s ease;box-shadow:var(--shadow-lg);pointer-events:none;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-success{background:var(--color-success)}
.toast-error{background:var(--color-danger)}

@media(max-width:860px){
  .sidebar{width:56px;min-width:56px}
  .sidebar .sidebar-nav span,.sidebar .nav-section{display:none}
  .sidebar-logo{padding:16px 8px;text-align:left}
  .sidebar-logo img{height:28px;margin:0 auto}
  .sidebar-nav .nav-item{padding:12px 0;justify-content:center;border-left:none;border-bottom:2px solid transparent}
  .sidebar-nav .nav-item.active{border-bottom-color:var(--color-primary)}
  .content-area{padding:16px}
}
</style>
</head>
<body>
<div class="app-layout">
<nav class="sidebar" aria-label="主导航">
  <div class="sidebar-logo"><img src="https://iili.io/CZ0tVNn.png" alt="RHC Medical"></div>
  <div class="sidebar-nav">
    <div class="nav-section">消息中心</div>
    <div class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span>全部消息</span></div>
    <div class="nav-item nav-item-back-home" onclick="window.location.href='panel.html'" role="button" tabindex="0"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>返回门户</span></div>
  </div>
</nav>

<div class="main-area">
  <main class="content-area">
    <div class="page-header">
      <div><h2>消息中心</h2><p>商机线索、系统通知，一目了然</p></div>
      <div class="page-header-actions">
        <button class="btn btn-outline" onclick="markAllRead()">全部标记已读</button>
      </div>
    </div>

    <div class="msg-filter-tabs" id="msg-filter-tabs">
      <button class="msg-filter-tab active" data-type="all" onclick="filterMessages('all',this)">全部 <span class="tab-count" id="count-all">0</span></button>
      <button class="msg-filter-tab" data-type="lead" onclick="filterMessages('lead',this)">商机线索 <span class="tab-count" id="count-lead">0</span></button>
      <button class="msg-filter-tab" data-type="system" onclick="filterMessages('system',this)">系统通知 <span class="tab-count" id="count-system">0</span></button>
    </div>

    <div class="msg-list" id="msg-list">
      <div class="loading-state"><div class="spin"></div><div>正在加载消息…</div></div>
    </div>
  </main>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
var toastTimer = null;
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' toast-' + type : '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() {
    t.className = 'toast' + (type ? ' toast-' + type : '');
  }, 3000);
}

var API_BASE = '';
var authToken = localStorage.getItem('rhc_auth_token');

function apiFetch(url, options) {
  options = options || {};
  options.headers = options.headers || {};
  if (authToken) options.headers['Authorization'] = 'Bearer ' + authToken;
  if (!options.headers['Content-Type'] && options.method && options.method !== 'GET') {
    options.headers['Content-Type'] = 'application/json';
  }
  return fetch(API_BASE + url, options);
}

var allMessages = [];
var currentFilter = 'all';

function formatTime(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr);
  var now = new Date();
  var diff = now - d;
  var mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return mins + '分钟前';
  var hours = Math.floor(mins / 60);
  if (hours < 24) return hours + '小时前';
  var days = Math.floor(hours / 24);
  if (days < 7) return days + '天前';
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getIconClass(type) {
  if (type === 'lead') return 'type-lead';
  if (type === 'system') return 'type-system';
  return 'type-email';
}

function getIconEmoji(type) {
  if (type === 'lead') return '🟢';
  if (type === 'system') return '🔔';
  return '📧';
}

function renderMessages() {
  var list = document.getElementById('msg-list');
  var filtered = currentFilter === 'all' ? allMessages : allMessages.filter(function(m) { return m.type === currentFilter; });

  // Update counts
  var countAll = document.getElementById('count-all');
  var countLead = document.getElementById('count-lead');
  var countSystem = document.getElementById('count-system');
  if (countAll) countAll.textContent = allMessages.length;
  if (countLead) countLead.textContent = allMessages.filter(function(m){return m.type==='lead'}).length;
  if (countSystem) countSystem.textContent = allMessages.filter(function(m){return m.type==='system'}).length;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="es-icon">📭</div><div class="es-title">暂无消息</div><div class="es-desc">当前没有' + (currentFilter === 'all' ? '' : '该类型的') + '消息，新消息会自动出现在这里</div></div>';
    return;
  }

  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var msg = filtered[i];
    var unreadClass = msg.status === 'unread' ? ' unread' : '';
    var actionsHtml = '';
    if (msg.type === 'lead') {
      actionsHtml = '<div class="msg-actions">'
        + '<button class="btn btn-primary" onclick="claimLead(\'' + msg.id + '\')">加入跟进</button>'
        + '<button class="btn btn-outline" onclick="markRead(\'' + msg.id + '\')">查看详情</button>'
        + '</div>';
    } else {
      actionsHtml = '<div class="msg-actions">'
        + '<button class="btn btn-outline" onclick="markRead(\'' + msg.id + '\')">查看详情</button>'
        + '</div>';
    }

    html += '<div class="msg-card' + unreadClass + '" id="msg-' + msg.id + '">'
      + '<div class="msg-icon ' + getIconClass(msg.type) + '">' + getIconEmoji(msg.type) + '</div>'
      + '<div class="msg-content">'
      + '<div class="msg-title">' + (msg.title || '') + '</div>'
      + '<div class="msg-summary">' + (msg.summary || msg.content || '') + '</div>'
      + '<div class="msg-meta">'
      + '<span class="msg-time">' + formatTime(msg.created_at) + '</span>'
      + actionsHtml
      + '</div>'
      + '</div>'
      + '</div>';
  }
  list.innerHTML = html;
}

function filterMessages(type, el) {
  currentFilter = type;
  var tabs = document.querySelectorAll('#msg-filter-tabs .msg-filter-tab');
  for (var i = 0; i < tabs.length; i++) {
    if (tabs[i] === el) {
      tabs[i].classList.add('active');
    } else {
      tabs[i].classList.remove('active');
    }
  }
  renderMessages();
}

function markRead(id) {
  apiFetch('/api/messages/' + id + '/read', { method: 'PUT' })
    .then(function(res) {
      if (res.ok) {
        for (var i = 0; i < allMessages.length; i++) {
          if (allMessages[i].id === id) { allMessages[i].status = 'read'; break; }
        }
        renderMessages();
        showToast('已标记为已读', 'success');
      }
    })
    .catch(function() { showToast('操作失败，请重试', 'error'); });
}

function markAllRead() {
  apiFetch('/api/messages/read-all', { method: 'POST' })
    .then(function(res) {
      if (res.ok) {
        for (var i = 0; i < allMessages.length; i++) {
          allMessages[i].status = 'read';
        }
        renderMessages();
        showToast('已全部标记为已读', 'success');
      }
    })
    .catch(function() { showToast('操作失败，请重试', 'error'); });
}

function claimLead(msgId) {
  var msg = null;
  for (var i = 0; i < allMessages.length; i++) {
    if (allMessages[i].id === msgId) { msg = allMessages[i]; break; }
  }
  if (!msg) return;

  apiFetch('/api/leads/claim', {
    method: 'POST',
    body: JSON.stringify({ message_id: msgId, company: msg.company || msg.title })
  })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      showToast('已加入跟进', 'success');
      markRead(msgId);
    })
    .catch(function() { showToast('认领失败，请重试', 'error'); });
}

function loadMessages() {
  apiFetch('/api/messages')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      allMessages = data.messages || data || [];
      renderMessages();
    })
    .catch(function() {
      document.getElementById('msg-list').innerHTML = '<div class="empty-state"><div class="es-icon">📭</div><div class="es-title">消息加载失败</div><div class="es-desc">请刷新页面重试</div></div>';
    });
}

// Sidebar nav click handler
document.querySelectorAll('.sidebar-nav .nav-item').forEach(function(item){
  item.addEventListener('keydown',function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); item.click(); }
  });
});

document.addEventListener('DOMContentLoaded', function() {
  loadMessages();
  // Dynamic user info
  try {
    var info = JSON.parse(localStorage.getItem('rhc_user_info') || '{}');
    if (info.name) {
      var nameEls = document.querySelectorAll('.user-name');
      for (var i = 0; i < nameEls.length; i++) nameEls[i].textContent = info.name;
      var avatarEls = document.querySelectorAll('.avatar');
      for (var k = 0; k < avatarEls.length; k++) avatarEls[k].textContent = info.name.charAt(0);
    }
  } catch(e) {}
});
</script>
</body>
</html>
