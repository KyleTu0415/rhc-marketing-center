<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="assets/rhc-fonts.css">

<title>RHC 安瑞康 — 售后中心</title>
<style>
:root{
  --color-bg:#F7F8FA; --color-surface:#FFFFFF;
  --color-primary:#C8102E; --color-primary-dark:#A50D26;
  --color-primary-light:#FDE8EB; --color-primary-xlight:#FFF1F3;
  --color-text:#1A1A1A; --color-text-secondary:#6B7280; --color-text-tertiary:#9CA3AF;
  --color-border:#E5E7EB; --color-border-light:#F3F4F6;
  --color-success:#16A37B; --color-warning:#F3A94B; --color-danger:#E5484D; --color-info:#3B82F6;
  --font-sans:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06); --shadow-md:0 4px 12px rgba(0,0,0,0.08); --shadow-lg:0 8px 24px rgba(0,0,0,0.10);
  --transition-fast:0.15s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--color-text);background:var(--color-bg);overflow:hidden}
a{color:var(--color-primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--font-sans);cursor:pointer;border:none;background:none;font-size:13px}
input,select,textarea{font-family:var(--font-sans);font-size:13px;border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--color-text);background:var(--color-surface);outline:none;transition:border-color var(--transition-fast)}
input:focus,select:focus,textarea:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(200,16,46,0.12)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--color-text-tertiary)}

.app-layout{display:flex;height:100vh;width:100vw}
.sidebar{width:200px;min-width:200px;background:var(--color-surface);border-right:1px solid var(--color-border);display:flex;flex-direction:column;overflow-y:auto;z-index:100}
.sidebar-logo{padding:15px 0 20px;text-align:left}
.sidebar-logo img{height:90px;width:auto;margin:0 auto;display:block}
.sidebar-logo span{display:block;font-size:13px;font-weight:700;color:var(--color-primary);margin-top:10px;letter-spacing:2px;text-transform:uppercase}
.sidebar-nav{flex:1;display:flex;flex-direction:column}
.sidebar-nav .nav-section{padding:4px 16px 10px;font-size:15px;letter-spacing:0.5px;color:var(--color-text-secondary);font-weight:700;text-align:left}
.sidebar-nav .nav-item{display:flex;align-items:center;gap:8px;padding:7px 16px;color:#6B7280;font-size:13px;font-weight:500;cursor:pointer;transition:all var(--transition-fast);border-left:3px solid transparent;text-decoration:none;position:relative}
.sidebar-nav a.nav-item:hover{text-decoration:none}
.sidebar-nav .nav-item:hover{background:var(--color-primary-xlight);color:var(--color-primary)}
.sidebar-nav .nav-item.active{background:var(--color-primary-xlight);color:var(--color-primary);font-weight:600;border-left-color:var(--color-primary)}
.sidebar-nav .nav-item .nav-icon{width:14px;height:14px;flex-shrink:0;color:var(--color-text-tertiary);opacity:0.7}
.sidebar-nav .nav-item:hover .nav-icon,.sidebar-nav .nav-item.active .nav-icon{color:var(--color-primary)}
.sidebar-nav .nav-item-back-home{border-top:1px solid var(--color-border-light);margin-top:auto;padding-top:11px}
.nav-item.nav-item-back-home,.nav-item.nav-item-back-home .nav-icon{color:var(--color-primary);font-weight:600;font-size:14px;opacity:1}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--color-border-light)}
.sidebar-user{display:flex;align-items:center;gap:8px}
.sidebar-user .avatar{width:30px;height:30px;border-radius:50%;background:var(--color-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
.sidebar-user .user-name{font-size:13px;font-weight:600}
.sidebar-user .user-role{font-size:11px;color:var(--color-text-tertiary)}
.main-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.page{display:none;animation:fadeIn 0.3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-header{margin-bottom:24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.page-header h2{font-size:18px;font-weight:700;color:var(--color-text);margin:0 0 4px}
.page-header p{margin:0;font-size:14px;color:var(--color-text-secondary)}
.page-header-actions{display:flex;align-items:center;gap:12px;flex-shrink:0}
.content-area{flex:1;overflow-y:auto;padding:20px 28px 28px;scroll-behavior:smooth}

.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;margin-bottom:20px}
.card-header{padding:16px 20px;border-bottom:1px solid var(--color-border-light);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-header h3{font-size:14px;font-weight:600}
.card-header .card-sub{font-size:12px;color:var(--color-text-tertiary);font-weight:400}
.card-body{padding:20px}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.2px;white-space:nowrap}
.tag-success{background:#E6F9F1;color:#0D7B57}
.tag-warning{background:#FFF4E0;color:#B27A1B}
.tag-gray{background:#F0F2F3;color:#637089}
.tag-primary{background:var(--color-primary-light);color:var(--color-primary-dark)}
.tag-info{background:#E8F0FE;color:#1A56C4}
.tag-danger{background:#FDECEC;color:#B4232A}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;transition:all var(--transition-fast)}
.btn-primary{background:var(--color-primary);color:#fff}
.btn-primary:hover{background:var(--color-primary-dark)}
.btn-outline{border:1px solid var(--color-border);color:var(--color-text-secondary);background:var(--color-surface)}
.btn-outline:hover{border-color:var(--color-primary);color:var(--color-primary)}
.btn-sm{padding:6px 12px;font-size:12px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--color-text-secondary);letter-spacing:0.5px;margin-bottom:6px}
.form-group select,.form-group input,.form-group textarea{width:100%}

.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.stat-mini{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:14px 18px}
.stat-mini .sm-val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-mini .sm-label{font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.dist-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.dist-bars{display:flex;flex-direction:column;gap:10px}
.dist-row{display:flex;align-items:center;gap:10px;font-size:12px}
.dist-label{width:84px;flex-shrink:0;color:var(--color-text-secondary);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dist-track{flex:1;background:var(--color-bg);border-radius:6px;height:16px;min-width:40px;overflow:hidden}
.dist-fill{height:100%;border-radius:6px;background:var(--color-primary);width:0;transition:width .5s ease}
.dist-fill.fill-blue{background:var(--color-info)}
.dist-val{width:28px;flex-shrink:0;font-weight:600;font-variant-numeric:tabular-nums}
@media(max-width:860px){.dist-grid{grid-template-columns:1fr}}

.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table thead{background:var(--color-bg)}
.data-table th{text-align:left;padding:12px 16px;font-weight:600;font-size:12px;color:var(--color-text-secondary);letter-spacing:0.4px;border-bottom:1px solid var(--color-border);white-space:nowrap}
.data-table td{padding:13px 16px;border-bottom:1px solid var(--color-border-light);vertical-align:middle}
.data-table tbody tr{transition:background var(--transition-fast)}
.data-table tbody tr:hover{background:var(--color-primary-xlight)}

.state-message{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 20px;gap:10px;color:var(--color-text-secondary);font-size:13px}
.state-message .state-title{font-size:14px;font-weight:600;color:var(--color-text)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px 64px;gap:6px}
.empty-state .es-icon{width:64px;height:64px;border-radius:50%;background:var(--color-primary-xlight);border:1px dashed var(--color-primary-light);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.empty-state .es-title{font-size:15px;font-weight:700;color:var(--color-text)}
.empty-state .es-desc{font-size:13px;color:var(--color-text-secondary);max-width:440px;line-height:1.7}
.empty-state .es-value{font-size:12.5px;color:var(--color-text-tertiary);max-width:440px;line-height:1.7;margin-top:2px}
.dist-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 12px 26px;text-align:center;color:var(--color-text-tertiary);font-size:12.5px;line-height:1.6}
.dist-empty svg{width:30px;height:30px;opacity:0.55;color:var(--color-text-tertiary)}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-card{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-header{padding:18px 24px;border-bottom:1px solid var(--color-border-light);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--color-surface);z-index:2}
.modal-header h3{font-size:16px;font-weight:700}
.modal-close{font-size:22px;color:var(--color-text-tertiary);cursor:pointer;line-height:1;background:none;border:none}
.modal-close:hover{color:var(--color-text)}
.modal-body{padding:20px 24px}
.modal-footer{padding:14px 24px;border-top:1px solid var(--color-border-light);display:flex;justify-content:flex-end;gap:8px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--color-text);color:#fff;padding:12px 24px;border-radius:var(--radius-md);font-size:13px;font-weight:500;z-index:2000;opacity:0;transition:all .3s ease;box-shadow:var(--shadow-lg);pointer-events:none;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-success{background:var(--color-success)}
.toast-error{background:var(--color-danger)}

@media(max-width:860px){
  .sidebar{width:56px;min-width:56px}
  .sidebar .sidebar-logo span,.sidebar .nav-item span,.sidebar .nav-section,.sidebar .sidebar-user .user-info{display:none}
  .sidebar-logo{padding:16px 8px;text-align:left}
  .sidebar-logo img{height:28px;margin:0 auto}
  .sidebar-nav .nav-item{padding:12px 0;justify-content:center;border-left:none;border-bottom:2px solid transparent}
  .sidebar-nav .nav-item.active{border-bottom-color:var(--color-primary)}
  .content-area{padding:16px}
  .data-table{font-size:12px}
  .data-table th,.data-table td{padding:10px 10px}
}
</style>
</head>
<body>
<div class="app-layout">
<nav class="sidebar" aria-label="主导航">
  <div class="sidebar-logo"><img src="https://iili.io/CZ0tVNn.png" alt="RHC Medical"></div>
  <div class="sidebar-nav">
    <div class="nav-section">售后中心</div>
    <div class="nav-item active" data-page="tickets" onclick="switchPage('tickets',this)" role="button" tabindex="0"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg><span>工单列表</span></div>
    <div class="nav-item" data-page="stats" onclick="switchPage('stats',this)" role="button" tabindex="0"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>工单统计</span></div>
    <div class="nav-item nav-item-back-home" onclick="window.location.href='panel.html'" role="button" tabindex="0"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>返回门户</span></div>
  </div>
</nav>
<div class="main-area">
    <main class="content-area">
    <section class="page active" id="page-tickets">
    <div class="page-header">
      <div><h2>工单列表</h2><p>售后工单受理、处理进度与服务闭环</p></div>
      <div class="page-header-actions"><button class="btn btn-primary btn-sm" onclick="openNewModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 新建工单</button></div>
    </div>
    <div class="card">
      <div id="ticket-area"><div class="state-message"><span class="loading-spinner" style="width:20px;height:20px;border:2.5px solid var(--color-border);border-top-color:var(--color-primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block"></span><div>正在加载工单数据…</div></div></div>
    </div>
    </section>

    <section class="page" id="page-stats">
    <div class="page-header">
      <div><h2>工单统计</h2><p>工单处理情况统计</p></div>
    </div>
    <div class="stat-strip" id="ticket-stats">
      <div class="stat-mini"><div class="sm-val" id="stat-total">—</div><div class="sm-label">工单总数</div></div>
      <div class="stat-mini"><div class="sm-val" id="stat-pending" style="color:var(--color-warning)">—</div><div class="sm-label">待处理</div></div>
      <div class="stat-mini"><div class="sm-val" id="stat-doing" style="color:var(--color-info)">—</div><div class="sm-label">处理中</div></div>
      <div class="stat-mini"><div class="sm-val" id="stat-done" style="color:var(--color-success)">—</div><div class="sm-label">已完成</div></div>
    </div>
    <div class="dist-grid">
      <div class="card"><div class="card-header"><h3>按工单状态</h3></div><div class="card-body"><div class="dist-bars" id="dist-status"></div></div></div>
      <div class="card"><div class="card-header"><h3>按工单类型</h3></div><div class="card-body"><div class="dist-bars" id="dist-type"></div></div></div>
    </div>
    </section>
  </main>
</div>
</div>

<div class="modal-overlay" id="new-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-card">
    <div class="modal-header"><h3>新建售后工单</h3><button class="modal-close" onclick="closeModal()" aria-label="关闭">&times;</button></div>
    <div class="modal-body">
      <div class="form-group"><label>客户 *</label>
        <select id="tf-customer" onchange="onCustomerChange()"><option value="">— 选择客户 —</option></select>
      </div>
      <div class="form-group"><label>关联订单</label>
        <select id="tf-order"><option value="">无关联订单</option></select>
      </div>
      <div class="form-group"><label>工单类型 *</label>
        <select id="tf-type"><option>质量问题</option><option>物流破损</option><option>备件补发</option><option>使用咨询</option><option>其他</option></select>
      </div>
      <div class="form-group"><label>问题描述 *</label>
        <textarea id="tf-desc" rows="4" placeholder="请描述设备型号、故障现象、使用场景等信息…"></textarea>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveTicket()">提交工单</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
function switchPage(pageId,el){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});var t=document.getElementById('page-'+pageId);if(t){t.classList.remove('active');void t.offsetWidth;t.classList.add('active')}document.querySelectorAll('.sidebar-nav .nav-item').forEach(function(n){n.classList.remove('active')});if(el)el.classList.add('active');var ca=document.querySelector('.content-area');if(ca)ca.scrollTop=0}
document.querySelectorAll('.sidebar-nav .nav-item').forEach(function(item){item.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();item.click()}})});
var TICKET_TYPES=['质量问题','物流破损','备件补发','使用咨询','其他'];
var snapshotData=null;
var toastTimer=null;
function showToast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(type?' toast-'+type:'');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className='toast'+(type?' toast-'+type:'')},3200)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var ICON_HEADSET='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z"/><path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>';
function emptyStateHtml(icon,title,desc,value){
  return '<div class="empty-state"><div class="es-icon">'+icon+'</div>'+
    '<div class="es-title">'+esc(title)+'</div>'+
    '<div class="es-desc">'+esc(desc)+'</div>'+
    (value?'<div class="es-value">'+esc(value)+'</div>':'')+'</div>';
}
function closeModal(){document.getElementById('new-modal').classList.remove('show')}
function openModal(){document.getElementById('new-modal').classList.add('show')}

function typeTag(t){
  var map={'质量问题':'tag-danger','物流破损':'tag-warning','备件补发':'tag-info','使用咨询':'tag-primary','其他':'tag-gray'};
  return '<span class="tag '+(map[t]||'tag-gray')+'">'+esc(t||'其他')+'</span>';
}
function statusTag(s){
  var map={'待处理':'tag-warning','处理中':'tag-info','已完成':'tag-success'};
  return '<span class="tag '+(map[s]||'tag-gray')+'">'+esc(s||'待处理')+'</span>';
}
function getExtraTickets(){
  try{return JSON.parse(localStorage.getItem('rhc_tickets_extra')||'[]')}catch(e){return[]}
}
function getAllTickets(){
  var base=(snapshotData&&snapshotData.tickets)?snapshotData.tickets:[];
  return base.concat(getExtraTickets());
}

function renderStats(list){
  document.getElementById('stat-total').textContent=list.length;
  document.getElementById('stat-pending').textContent=list.filter(function(t){return t['状态']==='待处理'}).length;
  document.getElementById('stat-doing').textContent=list.filter(function(t){return t['状态']==='处理中'}).length;
  document.getElementById('stat-done').textContent=list.filter(function(t){return t['状态']==='已完成'}).length;
}

function distBarsHtml(rows,fillClass){
  var max=0;rows.forEach(function(r){if(r.count>max)max=r.count});
  if(max===0)return '<div class="dist-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="3" y1="20" x2="21" y2="20"/></svg><span>暂无工单数据，售后工单接入飞书多维表后<br>按状态 / 类型自动统计呈现</span></div>';
  return rows.map(function(r){
    var pct=max>0?Math.round(r.count/max*100):0;
    return '<div class="dist-row" title="'+esc(r.label)+'：'+r.count+'"><div class="dist-label">'+esc(r.label)+'</div><div class="dist-track"><div class="dist-fill '+(fillClass||'')+'" style="width:'+pct+'%"></div></div><div class="dist-val">'+r.count+'</div></div>';
  }).join('');
}
function renderDist(list){
  var ds=document.getElementById('dist-status');
  if(ds){
    var sr=['待处理','处理中','已完成'].map(function(k){return{label:k,count:list.filter(function(t){return (t['状态']||'待处理')===k}).length}});
    ds.innerHTML=distBarsHtml(sr,'');
  }
  var dt=document.getElementById('dist-type');
  if(dt){
    var tr=TICKET_TYPES.map(function(k){return{label:k,count:list.filter(function(t){return t['类型']===k}).length}});
    dt.innerHTML=distBarsHtml(tr,'fill-blue');
  }
}
function renderTable(){
  var list=getAllTickets();
  renderStats(list);
  renderDist(list);
  if(list.length===0){
    document.getElementById('ticket-area').innerHTML=emptyStateHtml(ICON_HEADSET,
      '暂无工单',
      '售后工单接入飞书多维表后自动汇聚',
      '工单受理后自动跟踪处理进度：待处理 / 处理中 / 已完成全程可视，并按问题类型统计，让售后服务有记录、有闭环');
    return;
  }
  document.getElementById('ticket-area').innerHTML=
    '<table class="data-table"><thead><tr><th>工单号</th><th>客户</th><th>关联订单</th><th>类型</th><th>状态</th><th>创建日期</th><th>处理人</th></tr></thead><tbody>'+
    list.map(function(t){
      return '<tr>'+
        '<td style="font-weight:600;color:var(--color-primary)">'+esc(t['工单号'])+'</td>'+
        '<td>'+esc(t['客户'])+'</td>'+
        '<td>'+(t['关联订单']?esc(t['关联订单']):'<span style="color:var(--color-text-tertiary)">—</span>')+'</td>'+
        '<td>'+typeTag(t['类型'])+'</td>'+
        '<td>'+statusTag(t['状态'])+'</td>'+
        '<td style="white-space:nowrap;color:var(--color-text-secondary)">'+esc(t['创建日期'])+'</td>'+
        '<td>'+esc(t['处理人']||'待分配')+'</td>'+
      '</tr>';
    }).join('')+
    '</tbody></table>';
}

function openNewModal(){
  var cs=document.getElementById('tf-customer');
  cs.innerHTML='<option value="">— 选择客户 —</option>'+(snapshotData.customers||[]).map(function(c){
    return '<option value="'+esc(c['客户名称'])+'">'+esc(c['客户名称'])+'（'+esc(c['国家/地区']||'')+'）</option>';
  }).join('');
  document.getElementById('tf-order').innerHTML='<option value="">无关联订单（请先选择客户）</option>';
  document.getElementById('tf-desc').value='';
  document.getElementById('tf-type').value='质量问题';
  openModal();
}
function onCustomerChange(){
  var name=document.getElementById('tf-customer').value;
  var osel=document.getElementById('tf-order');
  if(!name){osel.innerHTML='<option value="">无关联订单</option>';return}
  var rel=(snapshotData.orders||[]).filter(function(o){return o['客户名称']===name});
  osel.innerHTML='<option value="">无关联订单</option>'+rel.map(function(o){
    return '<option value="'+esc(o['订单号'])+'">'+esc(o['订单号'])+' · '+esc(o['当前状态'])+' · '+esc(o['订单金额（原币）'])+'</option>';
  }).join('');
}
function saveTicket(){
  var customer=document.getElementById('tf-customer').value;
  var type=document.getElementById('tf-type').value;
  var desc=document.getElementById('tf-desc').value.trim();
  if(!customer){showToast('请选择客户','error');return}
  if(!desc){showToast('请填写问题描述','error');return}
  var tickets=getExtraTickets();
  var seq=tickets.length+1;
  var now=new Date();
  var yy=String(now.getFullYear()).slice(2),mm=String(now.getMonth()+1).padStart(2,'0'),dd=String(now.getDate()).padStart(2,'0');
  var record={
    '工单号':'AS-'+yy+mm+'-'+String(seq).padStart(3,'0'),
    '客户':customer,
    '关联订单':document.getElementById('tf-order').value,
    '类型':type,
    '状态':'待处理',
    '创建日期':now.getFullYear()+'-'+mm+'-'+dd,
    '处理人':'待分配',
    '问题描述':desc
  };
  tickets.push(record);
  localStorage.setItem('rhc_tickets_extra',JSON.stringify(tickets));
  closeModal();renderTable();
  showToast('已提交（框架阶段存本地；正式版写入飞书售后工单表并通知售后）','success');
}

fetch('data/snapshot.json',{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .then(function(d){snapshotData=d;renderTable()})
  .catch(function(){
    document.getElementById('ticket-area').innerHTML='<div class="state-message"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-warning)" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><div class="state-title">数据加载失败</div><div>无法读取 data/snapshot.json，请通过本地 HTTP 服务访问本页面。</div><button class="btn btn-outline btn-sm" onclick="location.reload()">重新加载</button></div>';
  });
</script>
