<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="assets/rhc-fonts.css">

<title>RHC 安瑞康 — 客户管理系统</title>
<style>
:root{
  --color-bg:#F7F8FA; --color-surface:#FFFFFF;
  --color-primary:#C8102E; --color-primary-dark:#A50D26;
  --color-primary-light:#FDE8EB; --color-primary-xlight:#FFF1F3;
  --color-text:#1A1A1A; --color-text-secondary:#6B7280; --color-text-tertiary:#9CA3AF;
  --color-border:#E5E7EB; --color-border-light:#F3F4F6;
  --color-success:#16A37B; --color-warning:#F3A94B; --color-danger:#E5484D; --color-info:#3B82F6;
  --font-sans:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06); --shadow-md:0 4px 12px rgba(0,0,0,0.08); --shadow-lg:0 8px 24px rgba(0,0,0,0.10);
  --transition-fast:0.15s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--color-text);background:var(--color-bg);overflow:hidden}
a{color:var(--color-primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--font-sans);cursor:pointer;border:none;background:none;font-size:13px}
input,select,textarea{font-family:var(--font-sans);font-size:13px;border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--color-text);background:var(--color-surface);outline:none;transition:border-color var(--transition-fast)}
input:focus,select:focus,textarea:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(200,16,46,0.12)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--color-text-tertiary)}

.app-layout{display:flex;height:100vh;width:100vw}
.sidebar{width:200px;min-width:200px;background:var(--color-surface);border-right:1px solid var(--color-border);display:flex;flex-direction:column;overflow-y:auto;z-index:100}
.sidebar-logo{padding:15px 0 20px;text-align:left}
.sidebar-logo img{height:90px;width:auto;margin:0 auto;display:block}
.sidebar-logo span{display:block;font-size:13px;font-weight:700;color:var(--color-primary);margin-top:10px;letter-spacing:2px;text-transform:uppercase}
.sidebar-nav{flex:1;display:flex;flex-direction:column}
.sidebar-nav .nav-section{padding:4px 16px 10px;font-size:15px;letter-spacing:0.5px;color:var(--color-text-secondary);font-weight:700;text-align:left}
.sidebar-nav .nav-item{display:flex;align-items:center;gap:8px;padding:7px 16px;color:#6B7280;font-size:13px;font-weight:500;cursor:pointer;transition:all var(--transition-fast);border-left:3px solid transparent;text-decoration:none;position:relative}
.sidebar-nav a.nav-item:hover{text-decoration:none}
.sidebar-nav .nav-item:hover{background:var(--color-primary-xlight);color:var(--color-primary)}
.sidebar-nav .nav-item.active{background:var(--color-primary-xlight);color:var(--color-primary);font-weight:600;border-left-color:var(--color-primary)}
.sidebar-nav .nav-item .nav-icon{width:14px;height:14px;flex-shrink:0;color:var(--color-text-tertiary);opacity:0.7}
.sidebar-nav .nav-item:hover .nav-icon,.sidebar-nav .nav-item.active .nav-icon{color:var(--color-primary)}
.sidebar-nav .nav-item-back-home{border-top:1px solid var(--color-border-light);margin-top:auto;padding-top:11px}
.nav-item.nav-item-back-home,.nav-item.nav-item-back-home .nav-icon{color:var(--color-primary);font-weight:600;font-size:14px;opacity:1}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--color-border-light)}
.sidebar-user{display:flex;align-items:center;gap:8px}
.sidebar-user .avatar{width:30px;height:30px;border-radius:50%;background:var(--color-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
.sidebar-user .user-name{font-size:13px;font-weight:600}
.sidebar-user .user-role{font-size:11px;color:var(--color-text-tertiary)}
.main-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.page{display:none;animation:fadeIn 0.3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-header{margin-bottom:24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.page-header h2{font-size:18px;font-weight:700;color:var(--color-text);margin:0 0 4px}
.page-header p{margin:0;font-size:14px;color:var(--color-text-secondary)}
.page-header-actions{display:flex;align-items:center;gap:12px;flex-shrink:0}
.content-area{flex:1;overflow-y:auto;padding:20px 28px 28px;scroll-behavior:smooth}

.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.2px;white-space:nowrap}
.tag-success{background:#E6F9F1;color:#0D7B57}
.tag-warning{background:#FFF4E0;color:#B27A1B}
.tag-gray{background:#F0F2F3;color:#637089}
.tag-primary{background:var(--color-primary-light);color:var(--color-primary-dark)}
.tag-info{background:#E8F0FE;color:#1A56C4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;transition:all var(--transition-fast)}
.btn-primary{background:var(--color-primary);color:#fff}
.btn-primary:hover{background:var(--color-primary-dark)}
.btn-outline{border:1px solid var(--color-border);color:var(--color-text-secondary);background:var(--color-surface)}
.btn-outline:hover{border-color:var(--color-primary);color:var(--color-primary)}
.btn-sm{padding:6px 12px;font-size:12px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--color-text-secondary);letter-spacing:0.5px;margin-bottom:6px}
.form-group select,.form-group input,.form-group textarea{width:100%}

/* filter bar */
.filter-bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-wrap{position:relative;flex:1;min-width:220px;max-width:380px;display:flex;align-items:center}
.search-wrap svg{position:absolute;left:12px;width:15px;height:15px;color:var(--color-text-tertiary);pointer-events:none}
.search-wrap input{width:100%;padding:9px 12px 9px 36px}
.filter-bar select{padding:9px 12px;min-width:150px}
.list-count{font-size:12px;color:var(--color-text-tertiary);margin-left:auto;white-space:nowrap}

/* table */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table thead{background:var(--color-bg)}
.data-table th{text-align:left;padding:12px 16px;font-weight:600;font-size:12px;color:var(--color-text-secondary);letter-spacing:0.4px;border-bottom:1px solid var(--color-border);white-space:nowrap}
.data-table td{padding:13px 16px;border-bottom:1px solid var(--color-border-light);vertical-align:middle}
.data-table tbody tr{transition:background var(--transition-fast);cursor:pointer}
.data-table tbody tr:hover{background:var(--color-primary-xlight)}
.cell-main{font-weight:600}
.cell-sub{font-size:12px;color:var(--color-text-tertiary);margin-top:2px}

/* follow board */
.follow-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.follow-col{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden}
.follow-col-head{padding:12px 16px;border-bottom:1px solid var(--color-border-light);display:flex;align-items:center;gap:8px}
.follow-col-head .fc-name{font-size:13px;font-weight:700}
.follow-col-head .fc-count{margin-left:auto;font-size:11px;font-weight:700;background:var(--color-bg);border:1px solid var(--color-border);border-radius:10px;padding:1px 8px;color:var(--color-text-secondary)}
.follow-col-body{padding:10px;display:flex;flex-direction:column;gap:8px}
.follow-card{border:1px solid var(--color-border-light);border-radius:var(--radius-sm);padding:10px 12px;cursor:pointer;transition:all var(--transition-fast)}
.follow-card:hover{border-color:var(--color-primary);background:var(--color-primary-xlight)}
.follow-card .f-name{font-size:13px;font-weight:600;line-height:1.4}
.follow-card .f-meta{font-size:11px;color:var(--color-text-tertiary);margin-top:4px;line-height:1.6}
.follow-card.f-warn{border-color:var(--color-warning);background:#FFF8EC}
.follow-card.f-warn .f-name{color:#B27A1B}
.follow-warn-tag{display:inline-block;font-size:10px;font-weight:700;color:#B27A1B;background:#FFF4E0;border-radius:10px;padding:1px 8px;margin-top:6px}
.follow-empty{font-size:12px;color:var(--color-text-tertiary);text-align:center;padding:16px 6px}

/* modal / drawer */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-card{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-card.modal-lg{max-width:720px}
.modal-header{padding:18px 24px;border-bottom:1px solid var(--color-border-light);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--color-surface);z-index:2}
.modal-header h3{font-size:16px;font-weight:700}
.modal-close{font-size:22px;color:var(--color-text-tertiary);cursor:pointer;line-height:1;background:none;border:none}
.modal-close:hover{color:var(--color-text)}
.modal-body{padding:20px 24px}
.modal-footer{padding:14px 24px;border-top:1px solid var(--color-border-light);display:flex;justify-content:flex-end;gap:8px}

.detail-section{margin-bottom:18px}
.detail-section h4{font-size:12px;font-weight:600;color:var(--color-text-secondary);letter-spacing:0.5px;margin-bottom:8px;text-transform:uppercase}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
.detail-item{font-size:13px}
.detail-item .di-label{font-size:11px;color:var(--color-text-tertiary);margin-bottom:2px}
.detail-item .di-value{color:var(--color-text)}
.rel-order{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--color-border-light);border-radius:var(--radius-sm);margin-bottom:8px;font-size:13px;flex-wrap:wrap}
.rel-order .ro-no{font-weight:600}
.rel-order .ro-amount{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--color-text);color:#fff;padding:12px 24px;border-radius:var(--radius-md);font-size:13px;font-weight:500;z-index:2000;opacity:0;transition:all .3s ease;box-shadow:var(--shadow-lg);pointer-events:none;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-success{background:var(--color-success)}
.toast-error{background:var(--color-danger)}
.state-message{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 20px;gap:10px;color:var(--color-text-secondary);font-size:13px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px 64px;gap:6px}
.empty-state .es-icon{width:64px;height:64px;border-radius:50%;background:var(--color-primary-xlight);border:1px dashed var(--color-primary-light);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.empty-state .es-title{font-size:15px;font-weight:700;color:var(--color-text)}
.empty-state .es-desc{font-size:13px;color:var(--color-text-secondary);max-width:440px;line-height:1.7}
.empty-state .es-value{font-size:12.5px;color:var(--color-text-tertiary);max-width:440px;line-height:1.7;margin-top:2px}
.loading-row{display:flex;align-items:center;gap:10px;color:var(--color-text-secondary);font-size:13px;padding:40px 0;justify-content:center}
.loading-spinner{width:20px;height:20px;border:2.5px solid var(--color-border);border-top-color:var(--color-primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:860px){
  .sidebar{width:56px;min-width:56px}
  .sidebar .sidebar-logo span,.sidebar .nav-item span,.sidebar .nav-section,.sidebar .sidebar-user .user-info{display:none}
  .sidebar-logo{padding:16px 8px;text-align:left}
  .sidebar-logo img{height:28px;margin:0 auto}
  .sidebar-nav .nav-item{padding:12px 0;justify-content:center;border-left:none;border-bottom:2px solid transparent}
  .sidebar-nav .nav-item.active{border-bottom-color:var(--color-primary)}
  .content-area{padding:16px}
  .detail-grid{grid-template-columns:1fr}
  .list-count{display:none}
  .data-table{font-size:12px}
  .data-table th,.data-table td{padding:10px 10px}
}
</style>
</head>
<body>
<div class="app-layout">
<nav class="sidebar" aria-label="主导航">
  <div class="sidebar-logo"><img src="https://iili.io/CZ0tVNn.png" alt="RHC Medical"></div>
  <div class="sidebar-nav">
    <div class="nav-section">客户管理系统</div>
    <div class="nav-item active" data-page="list" onclick="switchPage('list',this)" role="button" tabindex="0"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>客户档案</span></div>
    <div class="nav-item" data-page="follow" onclick="switchPage('follow',this)" role="button" tabindex="0"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg><span>跟进状态</span></div>
    <div class="nav-item nav-item-back-home" onclick="window.location.href='panel.html'" role="button" tabindex="0"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>返回门户</span></div>
  </div>
</nav>
<div class="main-area">
    <main class="content-area">
    <section class="page active" id="page-list">
    <div class="page-header">
      <div><h2>客户档案</h2><p>全部客户信息、跟进状态与关联订单</p></div>
      <div class="page-header-actions"><button class="btn btn-primary btn-sm" onclick="openAddModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 新增客户</button></div>
    </div>
    <div class="filter-bar">
      <div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" id="search-input" placeholder="搜索客户名称 / 国家地区 / 联系人…" oninput="renderTable()"></div>
      <select id="status-filter" onchange="renderTable()">
        <option value="">全部跟进状态</option>
        <option>初步接触</option><option>需求沟通</option><option>报价中</option><option>已成交</option><option>复购中</option><option>沉睡</option>
      </select>
      <span class="list-count" id="list-count"></span>
    </div>
    <div class="card">
      <div id="table-area"><div class="loading-row"><span class="loading-spinner"></span> 正在加载客户数据…</div></div>
    </div>
    </section>

    <section class="page" id="page-follow">
    <div class="page-header">
      <div><h2>跟进状态</h2><p>按跟进状态分组查看客户与今日待办</p></div>
    </div>
    <div id="follow-area"><div class="loading-row"><span class="loading-spinner"></span> 正在加载客户数据…</div></div>
    </section>
  </main>
</div>
</div>

<!-- 客户详情弹窗 -->
<div class="modal-overlay" id="detail-modal" onclick="if(event.target===this)closeModal('detail-modal')">
  <div class="modal-card modal-lg">
    <div class="modal-header"><h3 id="detail-title">客户档案</h3><button class="modal-close" onclick="closeModal('detail-modal')" aria-label="关闭">&times;</button></div>
    <div class="modal-body" id="detail-body"></div>
  </div>
</div>

<!-- 新增客户弹窗 -->
<div class="modal-overlay" id="add-modal" onclick="if(event.target===this)closeModal('add-modal')">
  <div class="modal-card">
    <div class="modal-header"><h3>新增客户</h3><button class="modal-close" onclick="closeModal('add-modal')" aria-label="关闭">&times;</button></div>
    <div class="modal-body">
      <div class="form-group"><label>客户名称 *</label><input type="text" id="nf-name" placeholder="如：XXX Veterinary Supply Co."></div>
      <div class="form-group"><label>国家 / 地区 *</label><input type="text" id="nf-country" placeholder="如：美国"></div>
      <div class="form-group"><label>联系人</label><input type="text" id="nf-contact" placeholder="联系人姓名"></div>
      <div class="form-group"><label>跟进状态</label>
        <select id="nf-status"><option>初步接触</option><option>需求沟通</option><option>报价中</option><option>已成交</option><option>复购中</option><option>沉睡</option></select>
      </div>
      <div class="form-group"><label>主营产品</label><input type="text" id="nf-products" placeholder="如：X35VET兽用麻醉机、SA Series注射泵"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-outline" onclick="closeModal('add-modal')">取消</button><button class="btn btn-primary" onclick="saveCustomer()">保存客户</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
function switchPage(pageId,el){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});var t=document.getElementById('page-'+pageId);if(t){t.classList.remove('active');void t.offsetWidth;t.classList.add('active')}document.querySelectorAll('.sidebar-nav .nav-item').forEach(function(n){n.classList.remove('active')});if(el)el.classList.add('active');var ca=document.querySelector('.content-area');if(ca)ca.scrollTop=0}
document.querySelectorAll('.sidebar-nav .nav-item').forEach(function(item){item.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();item.click()}})});
var snapshotData=null;
var toastTimer=null;
function showToast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(type?' toast-'+type:'');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className='toast'+(type?' toast-'+type:'')},3200)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var ICON_USERS='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
var ICON_FILTER='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>';
function emptyStateHtml(icon,title,desc,value){
  return '<div class="empty-state"><div class="es-icon">'+icon+'</div>'+
    '<div class="es-title">'+esc(title)+'</div>'+
    '<div class="es-desc">'+esc(desc)+'</div>'+
    (value?'<div class="es-value">'+esc(value)+'</div>':'')+'</div>';
}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function openModal(id){document.getElementById(id).classList.add('show')}
function statusTag(s){
  var map={'已成交':'tag-success','复购中':'tag-info','报价中':'tag-warning'};
  return '<span class="tag '+(map[s]||'tag-gray')+'">'+esc(s||'—')+'</span>';
}
function getAllCustomers(){
  var extra=[];
  try{extra=JSON.parse(localStorage.getItem('rhc_customers_extra')||'[]')}catch(e){extra=[]}
  return (snapshotData? snapshotData.customers||[] :[]).concat(extra);
}
function getAllOrders(){return snapshotData? snapshotData.orders||[] :[]}

function renderTable(){
  if(!snapshotData)return;
  var kw=(document.getElementById('search-input').value||'').trim().toLowerCase();
  var st=document.getElementById('status-filter').value;
  var list=getAllCustomers().filter(function(c){
    if(st&&c['跟进状态']!==st)return false;
    if(!kw)return true;
    var hay=[c['客户名称'],c['国家/地区'],c['联系人']].join(' ').toLowerCase();
    return hay.indexOf(kw)>=0;
  });
  document.getElementById('list-count').textContent='共 '+list.length+' 家客户';
  if(list.length===0){
    if(getAllCustomers().length===0){
      document.getElementById('table-area').innerHTML=emptyStateHtml(ICON_USERS,
        '暂无客户档案',
        '客户数据接入飞书多维表后自动汇聚',
        '询盘客户、成交客户、跟进状态一目了然；支持搜索、按跟进状态筛选、查看客户档案与关联订单');
    }else{
      document.getElementById('table-area').innerHTML='<div class="state-message"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-tertiary)" stroke-width="1.6"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><div>没有符合条件的客户，请调整搜索或筛选条件。</div></div>';
    }
    return;
  }
  document.getElementById('table-area').innerHTML=
    '<table class="data-table"><thead><tr><th>客户名称</th><th>国家/地区</th><th>联系人</th><th>跟进状态</th><th>主营产品</th><th>最近跟进</th></tr></thead><tbody>'+
    list.map(function(c,i){
      return '<tr onclick="openDetail('+i+')" title="点击查看客户档案">'+
        '<td><div class="cell-main">'+esc(c['客户名称'])+'</div>'+(c['来源渠道']?'<div class="cell-sub">来源：'+esc(c['来源渠道'])+'</div>':'')+'</td>'+
        '<td>'+esc(c['国家/地区']||'—')+'</td>'+
        '<td>'+esc(c['联系人']||'—')+'</td>'+
        '<td>'+statusTag(c['跟进状态'])+'</td>'+
        '<td style="max-width:220px">'+esc(c['主营产品']||'—')+'</td>'+
        '<td style="color:var(--color-text-secondary);font-size:12px;white-space:nowrap">'+esc(c['最近跟进']||'—')+'</td>'+
      '</tr>';
    }).join('')+
    '</tbody></table>';
  window._filteredList=list;
}

function followDateOf(c){
  var raw=String(c['最近跟进']||'').trim();
  var m=raw.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m?new Date(+m[1],+m[2]-1,+m[3]):null;
}
function renderFollow(){
  var area=document.getElementById('follow-area');
  if(!area)return;
  if(!snapshotData){area.innerHTML='<div class="loading-row"><span class="loading-spinner"></span> 正在加载客户数据…</div>';return}
  var all=getAllCustomers();
  if(all.length===0){
    area.innerHTML='<div class="card">'+emptyStateHtml(ICON_FILTER,
      '暂无跟进记录',
      '客户档案接入飞书多维表后自动汇聚',
      '按「初步接触 / 需求沟通 / 报价中 / 已成交 / 复购中」分组展示客户，并自动标记超期未跟进提醒，让每一个客户都不被遗漏')+'</div>';
    return;
  }
  var order=['初步接触','需求沟通','报价中','已成交','复购中','沉睡'];
  var groups={};
  all.forEach(function(c){var st=c['跟进状态']||'未标记';(groups[st]=groups[st]||[]).push(c)});
  var keys=order.filter(function(k){return groups[k]}).concat(Object.keys(groups).filter(function(k){return order.indexOf(k)<0}));
  var today=new Date();today.setHours(0,0,0,0);
  var html='<div class="follow-grid">'+keys.map(function(st){
    var list=groups[st];
    return '<div class="follow-col"><div class="follow-col-head">'+statusTag(st)+'<span class="fc-count">'+list.length+'</span></div><div class="follow-col-body">'+
      list.map(function(c){
        var idx=all.indexOf(c);
        var d=followDateOf(c);
        var stale=false,warnText='';
        var raw=String(c['最近跟进']||'').trim();
        var doneStage=(st==='已成交'||st==='复购中');
        if(!doneStage){stale=true;warnText='待跟进'}
        else if(!d||!raw){stale=true;warnText='跟进日期缺失'}
        else{var diff=Math.round((today-d)/86400000);if(diff>=14){stale=true;warnText=diff+' 天未跟进'}}
        return '<div class="follow-card'+(stale?' f-warn':'')+'" onclick="openDetail('+idx+')" title="点击查看客户档案">'+
          '<div class="f-name">'+esc(c['客户名称'])+'</div>'+
          '<div class="f-meta">'+esc(c['国家/地区']||'—')+'　最近跟进：'+esc(raw||'暂无记录')+'</div>'+
          (stale?'<span class="follow-warn-tag">'+warnText+'</span>':'')+
        '</div>';
      }).join('')+
    '</div></div>';
  }).join('')+'</div>';
  area.innerHTML=html;
}
function openDetail(idx){
  var c=(window._filteredList&&window._filteredList[idx])||getAllCustomers()[idx]||null;
  if(!c)return;
  document.getElementById('detail-title').textContent=c['客户名称'];
  var relOrders=getAllOrders().filter(function(o){return o['客户名称']===c['客户名称']});
  var orderHtml=relOrders.length?
    relOrders.map(function(o){
      return '<div class="rel-order"><span class="ro-no">'+esc(o['订单号'])+'</span>'+statusTag(o['当前状态'])+
        '<span style="color:var(--color-text-secondary);font-size:12px">'+esc(o['下单日期'])+'</span>'+
        '<span class="ro-amount">'+esc(o['订单金额（原币）'])+'</span></div>';
    }).join(''):
    '<div style="font-size:13px;color:var(--color-text-tertiary);padding:6px 0">快照中暂无该客户的关联订单。</div>';
  document.getElementById('detail-body').innerHTML=
    '<div class="detail-section"><div style="margin-bottom:10px">'+statusTag(c['跟进状态'])+'</div>'+
      '<div class="detail-grid">'+
        '<div class="detail-item"><div class="di-label">客户名称</div><div class="di-value">'+esc(c['客户名称'])+'</div></div>'+
        '<div class="detail-item"><div class="di-label">国家/地区</div><div class="di-value">'+esc(c['国家/地区']||'—')+'</div></div>'+
        '<div class="detail-item"><div class="di-label">联系人</div><div class="di-value">'+esc(c['联系人']||'—')+'</div></div>'+
        '<div class="detail-item"><div class="di-label">邮箱</div><div class="di-value">'+esc(c['邮箱']||'—')+'</div></div>'+
        '<div class="detail-item"><div class="di-label">来源渠道</div><div class="di-value">'+esc(c['来源渠道']||'—')+'</div></div>'+
        '<div class="detail-item"><div class="di-label">主营产品</div><div class="di-value">'+esc(c['主营产品']||'—')+'</div></div>'+
        '<div class="detail-item" style="grid-column:1/-1"><div class="di-label">最近跟进</div><div class="di-value">'+esc(c['最近跟进']||'—')+'</div></div>'+
      '</div></div>'+
    '<div class="detail-section"><h4>备注</h4><div style="font-size:13px;color:var(--color-text);white-space:pre-wrap">'+esc(c['备注']||'—')+'</div></div>'+
    '<div class="detail-section"><h4>关联订单（'+relOrders.length+'）</h4>'+orderHtml+'</div>';
  openModal('detail-modal');
}

function openAddModal(){
  ['nf-name','nf-country','nf-contact','nf-products'].forEach(function(id){document.getElementById(id).value=''});
  document.getElementById('nf-status').value='初步接触';
  openModal('add-modal');
}
function saveCustomer(){
  var name=document.getElementById('nf-name').value.trim();
  var country=document.getElementById('nf-country').value.trim();
  if(!name||!country){showToast('请填写客户名称和国家/地区','error');return}
  var record={
    '客户名称':name,'国家/地区':country,
    '联系人':document.getElementById('nf-contact').value.trim(),
    '跟进状态':document.getElementById('nf-status').value,
    '主营产品':document.getElementById('nf-products').value.trim(),
    '来源渠道':'本地新增（框架）','最近跟进':'待跟进','备注':'框架阶段本地录入，正式版同步飞书客户表','邮箱':''
  };
  var extra=[];
  try{extra=JSON.parse(localStorage.getItem('rhc_customers_extra')||'[]')}catch(e){extra=[]}
  extra.push(record);
  localStorage.setItem('rhc_customers_extra',JSON.stringify(extra));
  closeModal('add-modal');
  renderTable();renderFollow();
  showToast('已暂存（框架阶段存本地；正式版写入飞书客户表）','success');
}

fetch('data/snapshot.json',{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .then(function(d){
    snapshotData=d;renderTable();renderFollow();
  })
  .catch(function(){
    var failHtml='<div class="state-message"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-warning)" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><div style="font-weight:600;color:var(--color-text)">数据加载失败</div><div>无法读取 data/snapshot.json，请通过本地 HTTP 服务访问本页面。</div><button class="btn btn-outline btn-sm" onclick="location.reload()">重新加载</button></div>';
    document.getElementById('table-area').innerHTML=failHtml;
    var fa=document.getElementById('follow-area');if(fa)fa.innerHTML=failHtml;
  });
</script>
